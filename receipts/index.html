<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="Free résumé builder and career toolkit by Rashad Oliver. One master résumé, versions you build by ticking what each job should see, a recruiter-style check, job tailoring, cover letters, and a network book. Everything stays on your device.">
<meta property="og:title" content="Receipts — build the story, keep the receipts">
<meta property="og:description" content="Free résumé builder and career toolkit. Nothing you type leaves your computer.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1a73e8">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Receipts">
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Libre+Franklin:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: app bar + left rail (desktop) / bottom bar (phone); a hub of tool cards; each tool = header + body; paper previews scale to fit their column. Palette: Google-style blue on cool neutrals. */
:root{
  --bg:#f8f9fa; --surface:#ffffff; --surface-2:#f1f3f4; --surface-3:#e8eaed; --fg:#1f1f1f; --muted:#5f6368; --line:#dadce0; --line-strong:#bdc1c6;
  --primary:#1a73e8; --primary-hover:#1765cc; --on-primary:#ffffff; --primary-soft:#e8f0fe; --on-primary-soft:#174ea6;
  --ok:#137333; --ok-soft:#e6f4ea; --warn:#b06000; --warn-soft:#fef7e0; --bad:#c5221f; --bad-soft:#fce8e6; --info:#1a73e8; --info-soft:#e8f0fe;
  --cat-build-bg:#e8f0fe; --cat-build-fg:#1967d2; --cat-improve-bg:#e6f4ea; --cat-improve-fg:#137333; --cat-learn-bg:#fef7e0; --cat-learn-fg:#b06000; --cat-files-bg:#f1f3f4; --cat-files-fg:#5f6368;
  --stage:#e8eaed; --paper:#ffffff; --paper-ink:#1d1f1e; --paper-muted:#4a5452; --paper-rule:#c9d1cf;
  --shadow-1:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15); --shadow-2:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15); --paper-shadow:0 8px 28px rgba(60,64,67,.22);
  --ui:"Roboto",system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --display:"Albert Sans","Google Sans","Roboto",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"EB Garamond",Garamond,Georgia,"Times New Roman",serif;
  --sans:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
  --condensed:"Bebas Neue","Oswald",Impact,"Arial Narrow",sans-serif;
  --r-s:8px; --r-m:12px; --r-l:20px; --r-pill:999px;
  --focus:0 0 0 2px var(--surface),0 0 0 4px var(--primary);
  --bar-h:64px; --rail-w:256px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1f1f; --surface:#282a2d; --surface-2:#303134; --surface-3:#3c4043; --fg:#e8eaed; --muted:#9aa0a6; --line:#3c4043; --line-strong:#5f6368;
  --primary:#8ab4f8; --primary-hover:#aecbfa; --on-primary:#062e6f; --primary-soft:#2c3d57; --on-primary-soft:#d2e3fc;
  --ok:#81c995; --ok-soft:#1e3a2a; --warn:#fdd663; --warn-soft:#3d3117; --bad:#f28b82; --bad-soft:#4a2320; --info:#8ab4f8; --info-soft:#2c3d57;
  --cat-build-bg:#2c3d57; --cat-build-fg:#aecbfa; --cat-improve-bg:#1e3a2a; --cat-improve-fg:#81c995; --cat-learn-bg:#3d3117; --cat-learn-fg:#fdd663; --cat-files-bg:#303134; --cat-files-fg:#bdc1c6;
  --stage:#171717; --paper-shadow:0 10px 32px rgba(0,0,0,.6);
  --shadow-1:0 1px 2px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); --shadow-2:0 2px 6px rgba(0,0,0,.5),0 8px 20px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1f1f; --surface:#282a2d; --surface-2:#303134; --surface-3:#3c4043; --fg:#e8eaed; --muted:#9aa0a6; --line:#3c4043; --line-strong:#5f6368;
  --primary:#8ab4f8; --primary-hover:#aecbfa; --on-primary:#062e6f; --primary-soft:#2c3d57; --on-primary-soft:#d2e3fc;
  --ok:#81c995; --ok-soft:#1e3a2a; --warn:#fdd663; --warn-soft:#3d3117; --bad:#f28b82; --bad-soft:#4a2320; --info:#8ab4f8; --info-soft:#2c3d57;
  --cat-build-bg:#2c3d57; --cat-build-fg:#aecbfa; --cat-improve-bg:#1e3a2a; --cat-improve-fg:#81c995; --cat-learn-bg:#3d3117; --cat-learn-fg:#fdd663; --cat-files-bg:#303134; --cat-files-fg:#bdc1c6;
  --stage:#171717; --paper-shadow:0 10px 32px rgba(0,0,0,.6);
  --shadow-1:0 1px 2px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); --shadow-2:0 2px 6px rgba(0,0,0,.5),0 8px 20px rgba(0,0,0,.4);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:600;letter-spacing:-.005em;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding-left:1.25em}
code,kbd{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
:focus-visible{outline:none;box-shadow:var(--focus)}
.skip{position:absolute;left:8px;top:-40px;background:var(--primary);color:var(--on-primary);padding:8px 12px;border-radius:var(--r-s);z-index:100}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.grow{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.tabular{font-variant-numeric:tabular-nums}

/* ---------- App frame ---------- */
.app{min-height:100%;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);grid-template-rows:var(--bar-h) minmax(0,1fr);grid-template-areas:"bar bar" "rail main"}
.appbar{grid-area:bar;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));height:var(--bar-h)}
.wordmark{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--fg);font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.01em}
.wordmark b{color:var(--primary);font-weight:700}
.wordmark b::after{content:".";color:var(--fg)}
.wordmark span{font-family:var(--ui);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.savestate{font-size:12px;color:var(--muted);white-space:nowrap}
.savestate.dirty{color:var(--warn)}
.rail{grid-area:rail;position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - var(--bar-h) - env(safe-area-inset-top,0px));overflow:auto;background:var(--bg);padding-block:12px 24px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px;display:flex;flex-direction:column;gap:2px}
.rail h3{font-family:var(--ui);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.rail a{display:flex;align-items:center;gap:14px;padding:9px 16px;border-radius:var(--r-pill);color:var(--fg);text-decoration:none;font-weight:500;font-size:14px;min-height:44px}
.rail a:hover{background:var(--surface-3)}
.rail a[aria-current="page"]{background:var(--primary-soft);color:var(--on-primary-soft);font-weight:600}
.rail a svg{width:20px;height:20px;flex-shrink:0;color:var(--muted)}
.rail a[aria-current="page"] svg{color:var(--on-primary-soft)}
.rail .pin{margin-left:auto;font-size:11px;color:var(--muted)}
main{grid-area:main;min-width:0;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main:focus{outline:none}
.bottombar{display:none}
.menu{display:none}
@media (max-width:1040px){
  :root{--rail-w:84px}
  .rail a{flex-direction:column;gap:4px;font-size:11px;padding:8px 4px;text-align:center;border-radius:var(--r-m)}
  .rail a span.lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72px}
  .rail h3{padding:10px 4px 4px;font-size:9px;text-align:center}
  .rail .pin{display:none}
  .rail details summary{flex-direction:column;gap:4px;font-size:11px;padding:8px 4px;text-align:center;border-radius:var(--r-m)}
  .rail details summary .chev{display:none}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"bar" "main"}
  .rail{display:none}
  .menu{display:inline-flex}
  .wordmark span{display:none}
  .bottombar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface-2);padding-top:4px;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bottombar a,.bottombar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 8px;font-size:11px;color:var(--muted);text-decoration:none;background:none;border:0;font-weight:500}
  .bottombar a[aria-current="page"]{color:var(--on-primary-soft)}
  .bottombar a[aria-current="page"] svg{background:var(--primary-soft);border-radius:var(--r-pill)}
  .bottombar svg{width:24px;height:24px;padding:4px 10px;box-sizing:content-box}
  main{padding-bottom:110px}
}

/* ---------- Buttons, chips, badges ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:var(--r-pill);border:1px solid transparent;font-weight:600;font-size:14px;line-height:1;text-decoration:none;white-space:nowrap;transition:background .15s,box-shadow .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px}
.btn-filled{background:var(--primary);color:var(--on-primary)}
.btn-filled:hover{background:var(--primary-hover);box-shadow:var(--shadow-1)}
.btn-tonal{background:var(--primary-soft);color:var(--on-primary-soft)}
.btn-tonal:hover{filter:brightness(.97);box-shadow:var(--shadow-1)}
.btn-outline{background:var(--surface);border-color:var(--line);color:var(--primary)}
.btn-outline:hover{background:var(--primary-soft)}
.btn-text{background:transparent;color:var(--primary);padding:0 12px}
.btn-text:hover{background:var(--primary-soft)}
.btn-danger{background:transparent;border-color:var(--line-strong);color:var(--bad)}
.btn-danger:hover{background:var(--bad-soft)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
.btn.xs{min-height:28px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--fg)}
.btn-icon:hover{background:var(--surface-2)}
.btn-icon svg{width:22px;height:22px}
.btn-icon.sm{width:32px;height:32px}.btn-icon.sm svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:var(--r-s);border:1px solid var(--line-strong);background:transparent;font-size:13px;font-weight:500;color:var(--fg)}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"],.chip.on{background:var(--primary-soft);border-color:transparent;color:var(--on-primary-soft)}
.chip.sm{min-height:26px;padding:0 9px;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--r-pill);font-size:12px;font-weight:600;line-height:1.5;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.info{background:var(--info-soft);color:var(--info)}.badge.primary{background:var(--primary-soft);color:var(--on-primary-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* ---------- Cards, fields, segments ---------- */
.card{background:var(--surface);border:1px solid transparent;border-radius:var(--r-l);padding:18px 20px}
.card.pad-s{padding:14px 16px}
.card.elev{box-shadow:var(--shadow-1)}
.card.outlined{border-color:var(--line)}
.card.tint{background:var(--primary-soft);border-color:transparent;color:var(--on-primary-soft)}
.card.note{background:var(--info-soft);border-color:transparent}
.card.warn{background:var(--warn-soft);border-color:transparent}
.card h2{font-size:20px;margin-bottom:6px}
.card h3{font-size:16px;margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field input,.field textarea,.field select{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-s);padding:10px 12px;font-size:15px;line-height:1.4;color:var(--fg);min-height:44px}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.field .help{font-size:12px;color:var(--muted)}
.field .help.err{color:var(--bad)}
.field.inline{flex-direction:row;align-items:center;gap:10px}
.field input[type="checkbox"],.field input[type="radio"]{width:18px;height:18px;min-height:0;accent-color:var(--primary)}
.field input[type="range"]{padding:0;border:0;min-height:0;accent-color:var(--primary)}
.field input[type="color"]{padding:2px;height:42px;width:64px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;padding:6px 0}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--primary);flex-shrink:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.grid2 .full,.grid3 .full{grid-column:1/-1}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:0;gap:0;max-width:100%;overflow:auto}
.seg button{border:0;border-left:1px solid var(--line);background:transparent;padding:8px 18px;font-weight:500;font-size:14px;color:var(--fg);white-space:nowrap;min-height:38px}
.seg button:first-child{border-left:0;border-radius:var(--r-pill) 0 0 var(--r-pill)}.seg button:last-child{border-radius:0 var(--r-pill) var(--r-pill) 0}
.seg button[aria-selected="true"]{background:var(--primary-soft);color:var(--on-primary-soft);font-weight:600}
.divider{height:1px;background:var(--line);margin:8px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
details.acc{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
details.acc summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;transition:transform .15s}
details.acc[open] summary::after{transform:rotate(225deg)}
details.acc .acc-body{padding:0 16px 16px;color:var(--fg)}
.prose{max-width:68ch;font-size:15.5px;line-height:1.6}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{margin:0 0 12px}
.prose li{margin-bottom:4px}
.prose h3{font-size:18px;margin:22px 0 8px}
.prose h4{font-size:15px;margin:16px 0 6px;font-family:var(--ui)}
.prose blockquote{margin:0 0 12px;padding:10px 14px;border-left:3px solid var(--primary);background:var(--surface-2);border-radius:0 var(--r-s) var(--r-s) 0}
.callout{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-m);background:var(--primary-soft);color:var(--on-primary-soft);font-size:14px}
.callout svg{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.table th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scroll-x{overflow-x:auto}
.pre{white-space:pre-wrap;font-family:var(--ui);font-size:14px;line-height:1.55;background:var(--surface-2);border-radius:var(--r-m);padding:14px 16px;max-height:420px;overflow:auto;border:1px solid var(--line)}
.copybox{position:relative}
.copybox .copy{position:absolute;top:8px;right:8px}
.empty{padding:22px;border:1px dashed var(--line-strong);border-radius:var(--r-m);color:var(--muted);text-align:center;font-size:14px}

/* ---------- Tool chrome ---------- */
.tool{max-width:1360px;margin:0 auto}
.toolhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.toolhead .ico{width:48px;height:48px;border-radius:50%;background:var(--primary-soft);color:var(--on-primary-soft);display:grid;place-items:center;flex-shrink:0}
.toolcard[data-cat="build"] .ico,.toolhead[data-cat="build"] .ico{background:var(--cat-build-bg);color:var(--cat-build-fg)}.toolcard[data-cat="improve"] .ico,.toolhead[data-cat="improve"] .ico{background:var(--cat-improve-bg);color:var(--cat-improve-fg)}.toolcard[data-cat="learn"] .ico,.toolhead[data-cat="learn"] .ico{background:var(--cat-learn-bg);color:var(--cat-learn-fg)}.toolcard[data-cat="files"] .ico,.toolhead[data-cat="files"] .ico{background:var(--cat-files-bg);color:var(--cat-files-fg)}
.toolhead .ico svg{width:24px;height:24px}
.toolhead .eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.toolhead h1{font-size:26px;line-height:1.15}
.toolhead .lede{color:var(--muted);max-width:60ch;margin-top:2px}
.toolhead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;margin-bottom:10px}
.backlink:hover{color:var(--primary)}
.backlink svg{width:16px;height:16px}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.twocol.narrow-right{grid-template-columns:minmax(0,1.3fr) minmax(300px,.9fr)}
.twocol.narrow-left{grid-template-columns:minmax(280px,.8fr) minmax(0,1.4fr)}
@media (max-width:980px){.twocol,.twocol.narrow-right,.twocol.narrow-left{grid-template-columns:minmax(0,1fr)}}
.twocol>*,.design>*,.bld>*,.stack>*,.card,.field,.toolgrid>*,.libgrid>*,.exportgrid>*{min-width:0}
input[type="file"]{max-width:100%}
.sticky{position:sticky;top:calc(var(--bar-h) + 16px + env(safe-area-inset-top,0px))}
@media (max-width:980px){.sticky{position:static}}

/* ---------- Hub ---------- */
.hero{background:var(--primary-soft);color:var(--on-primary-soft);border-radius:28px;padding:32px 32px 28px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.9fr);gap:24px;align-items:center;margin-bottom:22px;position:relative;overflow:hidden}
.hero h1{font-size:34px;line-height:1.1;color:var(--on-primary-soft);font-weight:600}
.hero p{color:var(--on-primary-soft);opacity:.85;max-width:54ch;margin-top:10px;font-size:15.5px}
.hero .btn-outline{background:transparent;border-color:var(--on-primary-soft);color:var(--on-primary-soft)}
.hero .btn-outline:hover{background:rgba(255,255,255,.35)}
.hero .steps{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hero .step{display:flex;gap:8px;align-items:center;background:var(--surface);border-radius:var(--r-pill);padding:6px 14px 6px 6px;font-size:13px;color:var(--fg);text-decoration:none;font-weight:500}
.hero .step i{width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.hero .step:hover{box-shadow:var(--shadow-1)}
.deskcard{background:var(--surface);color:var(--fg);border-radius:24px;padding:18px 20px;box-shadow:var(--shadow-1);position:relative;z-index:1}
.deskcard h3{font-size:14px;color:var(--muted);font-family:var(--ui);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.deskcard .name{font-family:var(--display);font-size:20px;font-weight:600}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr);padding:22px 18px}.hero h1{font-size:26px}}
.dropzone{border:2px dashed var(--line-strong);border-radius:24px;padding:24px;text-align:center;background:var(--surface);transition:border-color .15s,background .15s;cursor:pointer}
.dropzone:hover,.dropzone.over{border-color:var(--primary);background:var(--primary-soft);color:var(--on-primary-soft)}
.dropzone svg{width:32px;height:32px;color:var(--primary)}
.dropzone b{display:block;font-size:16px;margin:6px 0 2px}
.dropzone .small{color:var(--muted)}
.dropzone.over .small{color:inherit}
.dropoverlay{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--primary) 18%,transparent);backdrop-filter:blur(2px);display:none;place-items:center;pointer-events:none}
.dropoverlay.show{display:grid}
.dropoverlay div{background:var(--surface);color:var(--fg);border:2px dashed var(--primary);border-radius:20px;padding:28px 40px;font-size:20px;font-family:var(--display);font-weight:600;box-shadow:var(--shadow-2)}
.hubsec{margin:26px 0 10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hubsec h2{font-size:20px}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.toolcard{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid transparent;border-radius:var(--r-l);padding:18px 18px 16px;position:relative;transition:box-shadow .15s,transform .15s}
.toolcard:hover{box-shadow:var(--shadow-2);transform:translateY(-1px)}
.toolcard .ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--on-primary-soft);background:var(--primary-soft)}
.toolcard .ico svg{width:22px;height:22px}
.toolcard h3{font-size:16px}
.toolcard p{font-size:13.5px;color:var(--muted);flex:1}
.toolcard .foot{display:flex;align-items:center;gap:8px}
.toolcard .foot .badge{margin-right:auto}
.toolcard .pinbtn{position:absolute;top:10px;right:10px}
.toolcard .pinbtn[aria-pressed="true"] svg{fill:var(--primary);color:var(--primary)}
.toolcard a.cover{position:absolute;inset:0;border-radius:inherit}
.toolcard .foot .btn{position:relative;z-index:1}
.toolcard .pinbtn{z-index:1}

/* ---------- Builder ---------- */
.bld{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:start}
.bld.with-live{grid-template-columns:170px minmax(0,1fr) minmax(300px,32%)}
@media (max-width:1180px){.bld.with-live{grid-template-columns:170px minmax(0,1fr)}.bld .live{display:none}}
@media (max-width:860px){.bld,.bld.with-live{grid-template-columns:minmax(0,1fr)}.bld .secnav{position:static;display:flex;flex-direction:row;gap:6px;flex-wrap:wrap;padding:0;background:none;border:0}.bld .secnav h4{display:none}.bld .secnav a{padding:5px 10px;border:1px solid var(--line);border-radius:var(--r-pill);font-size:12px}.bld .secnav .btn{min-height:30px}}
h1[tabindex="-1"]:focus{box-shadow:none;outline:none}
.secnav{position:sticky;top:calc(var(--bar-h) + 16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px}
.secnav h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:4px 10px 6px;font-family:var(--ui)}
.secnav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-s);text-decoration:none;color:var(--fg);font-size:14px}
.secnav a:hover{background:var(--surface-2)}
.secnav a .n{margin-left:auto;font-size:11px;color:var(--muted)}
.secnav a.hiddenSec{color:var(--muted);text-decoration:line-through}
.editor{display:flex;flex-direction:column;gap:26px;max-width:880px;min-width:0}
.esec{scroll-margin-top:calc(var(--bar-h) + 70px)}
.esec .shead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.esec .shead h2{font-size:21px}
.esec .shead .tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tip{display:flex;gap:8px;align-items:flex-start;background:transparent;border-radius:var(--r-m);padding:2px 0 8px;font-size:13px;color:var(--muted);margin-bottom:4px}
.tip svg{width:16px;height:16px;flex-shrink:0;color:var(--primary);margin-top:3px}
.tip .x{margin-left:auto;width:26px;height:26px}
.entry{background:var(--surface);border:1px solid transparent;border-left:4px solid var(--primary);border-radius:var(--r-m);padding:14px 16px;margin-bottom:12px;scroll-margin-top:calc(var(--bar-h) + 70px);box-shadow:var(--shadow-1)}
.entry.flag{border-left-color:var(--warn)}
.entry .ehead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.entry .ehead .name{font-weight:700;font-size:16px;overflow-wrap:anywhere;flex:1;min-width:0}
.entry .ehead .ops{display:flex;gap:2px;flex-shrink:0}
.dates{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.dates .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding-bottom:11px;white-space:nowrap}
.dates .chk input{width:18px;height:18px;accent-color:var(--primary)}
@media (max-width:520px){.dates{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dates .chk{grid-column:1/-1;padding-bottom:0}}
.bul{position:relative}
.bul .lbl-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.verbpick{position:relative}
.verbmenu{position:absolute;right:0;top:calc(100% + 4px);z-index:20;width:min(360px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-2);padding:10px;display:none}
.verbmenu.open{display:block}
.verbmenu input{width:100%;border:1px solid var(--line-strong);border-radius:var(--r-s);padding:8px 10px;margin-bottom:8px;background:var(--surface)}
.verbmenu .cats{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.verbmenu .list{max-height:220px;overflow:auto;display:flex;flex-wrap:wrap;gap:4px}
.verbmenu .list button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:4px 10px;font-size:13px}
.verbmenu .list button:hover{background:var(--primary-soft);border-color:transparent}
.linecount{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.linecount .over{color:var(--warn);font-weight:600}
.live{position:sticky;top:calc(var(--bar-h) + 16px + env(safe-area-inset-top,0px))}
.live .livehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:13px;color:var(--muted)}
.design{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:980px){.design{grid-template-columns:minmax(0,1fr)}}
.custom h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--ui);margin:16px 0 8px}
.custom h3:first-child{margin-top:0}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.themes button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:10px 10px;text-align:left;font-size:14px;font-weight:600}
.themes button span{display:block;font-size:12px;color:var(--muted);font-weight:400}
.themes button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--on-primary-soft)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatch[aria-pressed="true"]{border-color:var(--fg)}
.toggle{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.toggle label{display:flex;gap:8px;align-items:center;flex:1;min-width:0;cursor:pointer}
.toggle label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--primary)}
.toggle .ops{display:flex;gap:0}
.stage{background:var(--stage);border-radius:var(--r-l);padding:24px;min-width:0}
.stage.compact{padding:12px}
.paperwrap{position:relative;width:100%;max-width:816px;margin:0 auto}
.paperwrap .paper{transform-origin:top left}
.pagemark{position:absolute;left:0;right:0;border-top:1px dashed var(--bad);pointer-events:none}
.pagemark span{position:absolute;right:6px;top:2px;font-size:10px;color:var(--bad);background:var(--surface);padding:0 4px;border-radius:3px}
.exportgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.exportgrid .card h3{display:flex;gap:8px;align-items:center}
.exportgrid .card p{font-size:13.5px;color:var(--muted);margin:4px 0 12px}

/* ---------- Paper (résumé & cover letter) ---------- */
.paper{background:var(--paper);color:var(--paper-ink);width:8.5in;min-height:11in;box-shadow:var(--paper-shadow);overflow-wrap:anywhere;
  --pa:#1d1f1e;--pfs:10.5pt;--pm-t:.7in;--pm-b:.7in;--pm-l:.7in;--pm-r:.7in;--plh:1.25;--psg:8pt;--pig:3pt;--pf:var(--serif);--phf:var(--pf);
  --name-size:2.15em;--name-weight:700;--name-case:none;--name-ls:.02em;--name-align:left;--name-color:var(--paper-ink);
  --title-size:1.02em;--title-case:none;--title-weight:400;--title-ls:0;--title-color:var(--paper-ink);--headrow:block;
  --contact-size:.93em;--contact-color:inherit;--contact-icons:inline;--contact-seps:none;--contact-justify:flex-start;
  --head-size:1.12em;--head-case:uppercase;--head-weight:600;--head-ls:.08em;--head-rule:1px;--head-rule-color:currentColor;--head-color:var(--paper-ink);--head-align:left;--head-gap:4px;
  --org-weight:700;--org-color:inherit;--role-style:italic;--role-color:inherit;--date-size:.92em;
  --bullet-char:"\2022";--bullet-indent:1.1em;--bullet-gap:0px;
  padding:var(--pm-t) var(--pm-r) var(--pm-b) var(--pm-l);font-size:calc(var(--pfs) * var(--pfs-scale,1));line-height:var(--plh);font-family:var(--pf)}
.paper *{margin:0}
.paper ul{padding-left:var(--bullet-indent);margin-top:1px;list-style:none}
.paper li{margin:0 0 var(--bullet-gap);position:relative}
.paper li::before{content:var(--bullet-char);position:absolute;left:calc(-1 * var(--bullet-indent) + .12em)}
.p-head{margin-bottom:9px;text-align:var(--name-align)}
.p-headrow{display:var(--headrow);justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.p-name{font-family:var(--phf);font-size:var(--name-size);line-height:1.05;letter-spacing:var(--name-ls);font-weight:var(--name-weight);text-transform:var(--name-case);color:var(--name-color)}
.p-title{font-size:var(--title-size);text-transform:var(--title-case);font-weight:var(--title-weight);letter-spacing:var(--title-ls);color:var(--title-color)}
.p-contact{font-size:var(--contact-size);color:var(--contact-color);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:4px;justify-content:var(--contact-justify)}
.p-contact .p-ico{display:var(--contact-icons);margin-right:.3em}
.p-contact .p-sep{display:var(--contact-seps);margin-left:10px;opacity:.6}
.p-contact span:first-child .p-sep{display:none}
.p-sec{margin-top:var(--psg)}
.p-sec h2{font-family:var(--phf);font-size:var(--head-size);letter-spacing:var(--head-ls);text-transform:var(--head-case);font-weight:var(--head-weight);color:var(--head-color);text-align:var(--head-align);border-bottom:var(--head-rule) solid var(--head-rule-color);padding-bottom:1px;margin-bottom:var(--head-gap)}
.p-item{margin-bottom:var(--pig);break-inside:avoid}
.p-row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.p-row .l{min-width:0}
.p-row .d{white-space:nowrap;font-size:var(--date-size);flex-shrink:0}
.p-org{font-weight:var(--org-weight);color:var(--org-color)}
.p-role{font-style:var(--role-style);color:var(--role-color)}
.p-desc{margin-top:1px}
.p-skill b{font-weight:700}
.paper.t-classic{--name-weight:400;--name-case:uppercase;--name-ls:.05em;--name-size:2.3em;--title-case:uppercase;--title-size:.92em;--title-ls:.06em;--headrow:flex;--head-weight:400;--head-size:1.2em;--head-ls:.1em;--pfs-scale:1.06}
.paper.t-modern{--name-color:var(--pa);--title-weight:600;--title-color:var(--paper-muted);--head-color:var(--pa);--head-rule:2px;--head-rule-color:var(--pa);--head-weight:700;--head-size:1em;--org-color:var(--pa)}
.paper.t-modern .p-head{border-left:6px solid var(--pa);padding-left:14px}
.paper.t-minimal{--name-weight:400;--name-ls:.14em;--name-case:uppercase;--name-size:1.9em;--name-align:center;--contact-justify:center;--title-color:var(--paper-muted);--head-rule:0px;--head-size:.8em;--head-ls:.2em;--head-color:var(--pa);--head-gap:6px;--role-style:normal;--role-color:var(--paper-muted);--plh:1.35;--psg:12pt}
.paper.t-minimal .p-head{margin-bottom:14px}
.paper.t-banner{padding-top:0;--name-size:2.4em;--head-rule:1px;--head-rule-color:var(--paper-rule);--head-color:var(--pa);--head-weight:700;--head-size:1em}
.paper.t-banner .p-head{background:var(--pa);color:#fff;--name-color:#fff;--title-color:#fff;--contact-color:#fff;margin:0 calc(-1 * var(--pm-r)) 12px calc(-1 * var(--pm-l));padding:.42in var(--pm-r) .32in var(--pm-l)}
.paper.t-banner .p-title{opacity:.92;margin-top:3px}
.paper.cover .p-body{white-space:pre-wrap;margin-top:14px;line-height:1.5}
.paper.cover .p-meta{margin-top:18px;white-space:pre-wrap}
.measure{position:absolute;left:-20000px;top:0;width:8.5in;visibility:hidden;pointer-events:none}
.thumb{width:100%;aspect-ratio:8.5/11;overflow:hidden;border-radius:6px;background:#fff;position:relative;border:1px solid var(--line)}
.thumb .paper{position:absolute;left:0;top:0;transform-origin:top left;box-shadow:none;min-height:11in}

/* ---------- Customizer ---------- */
.cust details.acc{margin-top:8px}
.cust .crow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.cust .crow:last-child{border-bottom:0}
.cust .crow .lbl{color:var(--fg)}
.cust .crow .val{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.cust .crow input[type="range"]{grid-column:1/-1;width:100%;accent-color:var(--primary);padding:0;min-height:0;border:0}
.cust .crow select{grid-column:1/-1;width:100%;border:1px solid var(--line-strong);border-radius:6px;padding:5px 8px;background:var(--surface);font-size:13px}
.cust .crow.mod .lbl::after{content:" •";color:var(--primary)}

/* ---------- Interview ---------- */
.iv .q{font-family:var(--display);font-size:24px;line-height:1.25;margin-bottom:6px}
.iv .hint{color:var(--muted);margin-bottom:14px}
.iv textarea{width:100%;min-height:180px;font-size:17px;line-height:1.5;padding:14px 16px;border:1px solid var(--line-strong);border-radius:var(--r-m);background:var(--surface);resize:vertical}
.iv textarea:focus{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.iv .mic{display:inline-flex;align-items:center;gap:8px}
.iv .mic.on{background:var(--bad);color:#fff;border-color:transparent}
.iv .mic.on .dot{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.iv .progress{display:flex;gap:4px;margin-bottom:16px}
.iv .progress i{flex:1;height:4px;border-radius:2px;background:var(--surface-3)}
.iv .progress i.done{background:var(--primary)}
.iv .progress i.now{background:var(--primary);opacity:.5}
.iv .cand{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.iv .cand input[type="checkbox"]{width:18px;height:18px;margin-top:10px;accent-color:var(--primary)}
.iv .cand input[type="text"]{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:14.5px;background:var(--surface)}
.iv .cand .meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.iv .cand select{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px;background:var(--surface)}
.pick{display:flex;flex-direction:column;gap:6px}
.pick button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:12px 14px;font-size:15px;transition:box-shadow .15s,border-color .15s}
.pick button:hover{border-color:var(--primary);background:var(--primary-soft)}
.pick button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px var(--primary) inset}
.pick button span{display:block;font-size:12.5px;color:var(--muted)}

/* ---------- Check ---------- */
.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:112px;height:112px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .track{stroke:var(--surface-3)}
.ring .val{stroke:var(--primary);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:30px;font-weight:700}
.issue{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:start;padding:12px 14px 12px 0;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:0}
.issue .stripe{align-self:stretch;border-radius:3px;background:var(--line-strong)}
.issue.high .stripe{background:var(--bad)}.issue.med .stripe{background:var(--warn)}.issue.low .stripe{background:var(--info)}.issue.good .stripe{background:var(--ok)}
.issue h4{font-family:var(--ui);font-size:15px;font-weight:600;margin-bottom:2px}
.issue p{font-size:13.5px;color:var(--muted)}
.issue .ex{font-size:13px;margin-top:6px;padding:8px 10px;background:var(--surface-2);border-radius:var(--r-s)}
.issue .ex b{color:var(--ok)}
.issue .ex s{color:var(--bad)}

/* ---------- Before/After ---------- */
.ba{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
.ba .b,.ba .a{padding:12px 14px;border-radius:var(--r-m);font-size:14.5px}
.ba .b{background:var(--bad-soft);border:1px solid transparent}
.ba .a{background:var(--ok-soft);border:1px solid transparent}
.ba .tag{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.ba .b .tag{color:var(--bad)}.ba .a .tag{color:var(--ok)}
.ba .why{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
@media (max-width:640px){.ba{grid-template-columns:minmax(0,1fr)}}
.rewrite .out{font-size:17px;padding:14px 16px;border-radius:var(--r-m);background:var(--surface-2);min-height:60px}

/* ---------- Verbs ---------- */
.verbgrid{display:flex;flex-wrap:wrap;gap:6px}
.verbgrid button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:6px 12px;font-size:14px}
.verbgrid button:hover{background:var(--primary-soft);border-color:transparent}

/* ---------- Library ---------- */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.libcard{background:var(--surface);border:1px solid transparent;border-radius:var(--r-l);padding:12px;display:flex;flex-direction:column;gap:10px}
.libcard h3{font-size:15px}
.libcard .meta{font-size:12.5px;color:var(--muted)}
.libcard.active{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}

/* ---------- Import review ---------- */
.imp .lines{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r-m);font-size:13px}
.imp .ln{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line)}
.imp .ln select{font-size:12px;padding:3px 4px;border:1px solid var(--line);border-radius:4px;background:var(--surface);min-width:0}
.imp .ln .t{overflow-wrap:anywhere;font-family:var(--mono);font-size:12px}
.imp .ln.tag-name .t{font-weight:700}
.imp .ln.tag-section{background:var(--primary-soft)}
.imp .ln.tag-entry .t{font-weight:600}
.imp .ln.tag-bullet .t{padding-left:14px}
.imp .ln.tag-ignore .t{color:var(--muted);text-decoration:line-through}
.imp .ln.tag-contact .t,.imp .ln.tag-headline .t{color:var(--info)}
.imp .ln.tag-note .t{color:var(--muted)}
.imp .outline{max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.imp .osec{border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px}
.imp .osec .oh{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.imp .osec .oh select{border:1px solid var(--line-strong);border-radius:6px;padding:4px 8px;background:var(--surface);font-weight:600}
.imp .oent{padding:6px 0;border-top:1px dashed var(--line);font-size:13.5px}
.imp .oent b{font-weight:700}
.imp .oent .m{color:var(--muted)}
.imp .oent ul{font-size:13px;color:var(--muted)}

/* ---------- Kit one-pager ---------- */
.kitstage{overflow:auto}
.kit{background:#fff;color:#111;border-radius:12px;overflow:hidden;box-shadow:var(--paper-shadow);width:100%;max-width:720px;margin:0 auto;font-family:var(--sans);line-height:1.4}
.kit p{margin:0 0 10px}.kit p:last-child{margin-bottom:0}
.kit .k-photo{object-fit:cover;background:#dfe3e8}
.kit .k-ph{display:grid;place-items:center;font-weight:700;font-size:28px;color:#555}
.kit .k-logo{display:flex;align-items:center;justify-content:center;background:#fff;border-radius:8px;min-height:56px;padding:6px}
.kit .k-logo img{max-width:100%;max-height:64px;object-fit:contain}
.kit .k-logo.k-text{background:#f1f3f4;font-weight:700;font-size:13px;text-align:center;letter-spacing:.02em;color:#222;line-height:1.15}
.kit .k-logo.wide{justify-content:flex-start;min-height:48px;padding:6px 10px;text-align:left}
.kit .k-link{display:inline-flex;flex-direction:column;gap:1px;background:var(--ka,#1b3fd0);color:#fff;text-decoration:none;padding:8px 12px;border-radius:6px;font-size:11px;line-height:1.2;max-width:100%}
.kit .k-link b{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.kit .k-link span{opacity:.9;overflow-wrap:anywhere}
.kit .k-proof-list{margin:0;padding-left:1.1em}.kit .k-proof-list li{margin-bottom:5px}.kit .k-proof-list b{font-weight:700}
.kit .k-chips{display:flex;flex-wrap:wrap;gap:6px}.kit .k-chips span{border:1px solid #d6dedd;border-radius:999px;padding:3px 10px;font-size:12.5px}
.kit .k-exp{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.kit .k-cap{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.2}.kit .k-cap span{font-weight:500;text-transform:none;letter-spacing:0;color:#444}
.kit .k-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kit .k-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
/* classic (RaShad) */
.kit-classic{font-family:var(--serif)}
.kit-classic .k-head{background:var(--ka,#1b3fd0);color:#fff;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.kit-classic .k-name{font-size:34px;line-height:1.05}
.kit-classic .k-hl{font-size:14px;letter-spacing:.06em;text-transform:uppercase;text-align:left;line-height:1.35}
.kit-classic .k-about-title{text-align:center;font-size:24px;letter-spacing:.3em;text-transform:uppercase;padding:18px 20px 6px}
.kit-classic .k-body{display:grid;grid-template-columns:200px 1fr;gap:22px;padding:10px 28px 22px}
.kit-classic .k-photo{width:100%;aspect-ratio:3/4;border-radius:6px}
.kit-classic .k-ph{width:100%;aspect-ratio:3/4;border-radius:6px}
.kit-classic .k-sub{font-size:13px;letter-spacing:.22em;text-transform:uppercase;text-align:center;font-weight:600;margin:14px 0 8px}
.kit-classic .k-logos{display:flex;flex-direction:column;gap:8px}
.kit-classic .k-about{font-size:15.5px;line-height:1.5}
.kit-classic .k-proof{background:#e9e9e9;padding:16px 18px;margin-top:16px;border-radius:4px}
.kit-classic .k-proof-t{font-size:19px;margin-bottom:8px}
.kit-classic .k-foot{background:#111;color:#fff;padding:12px 28px;display:flex;gap:28px;flex-wrap:wrap;font-size:16px}
/* bold (Elijah) */
.kit-bold .k-top{position:relative;text-align:center;padding:22px 28px 16px}
.kit-bold .k-top .k-link{position:absolute;left:0;top:0;border-radius:0 0 8px 0;text-align:left}
.kit-bold .k-name{font-family:var(--condensed);font-size:56px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.kit-bold .k-hl{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#777;margin-top:6px;font-weight:600}
.kit-bold .k-socials{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;margin-top:10px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#777}
.kit-bold .k-socials i{font-style:normal;font-weight:700;color:#111;margin-right:6px;letter-spacing:0}
.kit-bold .k-band{background:#111;color:#fff;display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center;padding:22px 28px}
.kit-bold .k-photo{width:200px;height:200px;border-radius:50%;border:4px solid #fff}
.kit-bold .k-ph{width:200px;height:200px;border-radius:50%;border:4px solid #fff;color:#ddd;background:#444}
.kit-bold .k-h1{font-family:var(--condensed);font-size:30px;letter-spacing:.04em;text-align:center;margin-bottom:6px}
.kit-bold .k-about{font-size:12.5px;line-height:1.55;text-transform:uppercase;text-align:center;letter-spacing:.02em}
.kit-bold .k-cols{display:grid;grid-template-columns:1fr 1.15fr;gap:24px;padding:20px 28px 26px}
.kit-bold .k-h2{font-family:var(--condensed);font-size:24px;letter-spacing:.03em;margin:4px 0 10px}
.kit-bold .k-h2.c{text-align:center}
.kit-bold .k-cols>div+div{border-left:3px solid #111;padding-left:20px}
/* modern */
.kit-modern .k-head{background:var(--ka,#1b3fd0);color:#fff;padding:26px 28px;display:flex;gap:18px;align-items:center}
.kit-modern .k-photo,.kit-modern .k-ph{width:92px;height:92px;border-radius:50%;flex-shrink:0}
.kit-modern .k-name{font-family:var(--display);font-size:28px;font-weight:700}
.kit-modern .k-hl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.9;margin-top:4px}
.kit-modern .k-ct{font-size:13px;opacity:.92;margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 14px}
.kit-modern .k-body{padding:22px 28px;display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
.kit-modern .k-h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ka,#1b3fd0);font-family:var(--ui);margin-bottom:8px;font-weight:700}
.kit-modern .k-about{font-size:14.5px;line-height:1.55}
.kit-modern .k-proofgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kit-modern .k-proofgrid div{background:#f1f5f4;border-radius:10px;padding:10px 12px}.kit-modern .k-proofgrid b{display:block;font-size:20px;font-family:var(--display);color:var(--ka,#1b3fd0)}.kit-modern .k-proofgrid span{font-size:12px;color:#4a5452}
.kit-modern .k-cta{grid-column:1/-1;background:var(--ka,#1b3fd0);color:#fff;border-radius:10px;padding:12px 16px;font-weight:600;text-align:center}
.kit-modern .k-foot{padding:0 28px 22px}
@media (max-width:640px){.kit-classic .k-body,.kit-bold .k-band,.kit-bold .k-cols,.kit-modern .k-body{grid-template-columns:minmax(0,1fr)}.kit-bold .k-cols>div+div{border-left:0;padding-left:0}.kit-bold .k-name{font-size:40px}.kit-bold .k-photo,.kit-bold .k-ph{margin:0 auto}.kit-modern .k-head{flex-direction:column;text-align:center}.kit-modern .k-ct{justify-content:center}}

/* ---------- Tailoring ---------- */
mark.hl{background:#fff3b0;color:inherit;border-radius:2px;padding:0 1px}
.tailorstrip{background:var(--surface-2)}

/* ---------- Negotiation ---------- */
.numbar{position:relative;height:54px;margin:14px 0 6px}
.numbar .track{position:absolute;left:0;right:0;top:24px;height:6px;border-radius:3px;background:var(--surface-3)}
.numbar .pt{position:absolute;top:14px;width:2px;height:26px;background:var(--fg);transform:translateX(-1px)}
.numbar .pt i{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:700;white-space:nowrap}
.numbar .pt em{position:absolute;top:28px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.numbar .pt.base{background:var(--bad)}.numbar .pt.offer{background:var(--info)}.numbar .pt.target{background:var(--ok)}.numbar .pt.ask{background:var(--primary)}

/* ---------- Dialog, toast, snack ---------- */
dialog.dialog{border:0;border-radius:28px;padding:0;background:var(--surface);color:var(--fg);max-width:min(880px,calc(100vw - 32px));width:100%;box-shadow:var(--shadow-2);max-height:calc(100vh - 32px)}
dialog.dialog::backdrop{background:rgba(6,20,19,.5)}
dialog.dialog .dlg-inner{padding:22px 24px 20px}
dialog.dialog h2{font-size:21px;margin-bottom:6px;padding-right:40px}
dialog.dialog .dlg-x{position:absolute;top:12px;right:12px}
dialog.dialog .dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
dialog.dialog.wide{max-width:min(1180px,calc(100vw - 32px))}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r-pill);font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:70;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:760px){.toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}}
.snack{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 8px 8px 16px;border-radius:var(--r-m);font-size:14px;display:flex;gap:12px;align-items:center;z-index:71;box-shadow:var(--shadow-2);max-width:calc(100vw - 32px)}
.snack .btn-text{color:var(--primary-soft)}
@media (max-width:760px){.snack{bottom:calc(80px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* ---------- Shell v2: nav groups, palette, landing, desk, builder toolbar, sheets ---------- */
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--maxw:1240px}
.rail .grp{display:flex;flex-direction:column;gap:2px}
.rail details{border:0}
.rail details summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:9px 16px;border-radius:var(--r-pill);font-weight:500;font-size:14px;color:var(--muted);min-height:44px}
.rail details summary::-webkit-details-marker{display:none}
.rail details summary svg{width:20px;height:20px;transition:transform .15s}
.rail details[open] summary svg.chev{transform:rotate(180deg)}
.rail details summary:hover{background:var(--surface-3)}
.rail .sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 16px 4px;font-weight:600}
.appbar .btn-icon{color:var(--muted)}
.appbar .searchbtn{display:inline-flex;align-items:center;gap:10px;background:var(--surface-2);border:0;border-radius:var(--r-pill);padding:0 14px 0 12px;height:40px;color:var(--muted);font-size:14px;min-width:220px;cursor:text}
.appbar .searchbtn kbd{margin-left:auto;background:var(--surface);border:1px solid var(--line);font-size:11px;padding:1px 6px;border-radius:6px;color:var(--muted)}
.appbar .searchbtn svg{width:20px;height:20px}
@media (max-width:900px){.appbar .searchbtn{min-width:0;padding:0 10px}.appbar .searchbtn span,.appbar .searchbtn kbd{display:none}}
dialog.pal{max-width:640px;padding:0;align-self:flex-start;margin-top:10vh}
.pal .pin{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pal .pin svg{width:22px;height:22px;color:var(--muted)}
.pal .pin input{flex:1;border:0;background:transparent;font-size:17px;outline:none;color:var(--fg)}
.pal .plist{max-height:60vh;overflow:auto;padding:8px}
.pal .pgrp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 12px 4px;font-weight:600}
.pal .pitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-m);cursor:pointer;color:var(--fg);text-decoration:none}
.pal .pitem svg{width:20px;height:20px;color:var(--muted);flex-shrink:0}
.pal .pitem .d{font-size:12.5px;color:var(--muted)}
.pal .pitem[aria-selected="true"],.pal .pitem:hover{background:var(--primary-soft)}
.pal .pitem[aria-selected="true"] svg{color:var(--on-primary-soft)}
.pal .pfoot{padding:8px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:14px}

/* Landing */
.landing{max-width:var(--maxw);margin:0 auto}
.l-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:40px;align-items:center;padding:32px 0 48px}
.l-hero .eyebrow{display:inline-flex;gap:8px;align-items:center;background:var(--primary-soft);color:var(--on-primary-soft);border-radius:var(--r-pill);padding:6px 14px;font-size:13px;font-weight:600;margin-bottom:18px}
.l-hero h1{font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-.02em;font-weight:600;max-width:14ch}
.l-hero .sub{font-size:19px;color:var(--muted);max-width:46ch;margin:18px 0 26px;line-height:1.5}
.l-hero .ctas{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.l-hero .ctas .btn{min-height:48px;padding:0 24px;font-size:15px}
.l-hero .fine{font-size:13px;color:var(--muted);margin-top:14px}
.l-hero .fine a{color:var(--primary);text-decoration:none;font-weight:500}
.l-shot{position:relative;padding:28px}
.l-shot .thumb{box-shadow:var(--shadow-2);border-radius:8px;border:0;transform:rotate(-1.5deg)}
.l-shot .chipf{position:absolute;background:var(--surface);border-radius:var(--r-pill);box-shadow:var(--shadow-2);padding:8px 14px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.l-shot .chipf svg{width:18px;height:18px}
.l-shot .c1{left:0;top:28%}.l-shot .c2{right:0;top:12%}.l-shot .c3{right:6%;bottom:14%}
.l-sec{padding:40px 0;border-top:1px solid var(--line)}
.l-sec h2{font-size:28px;letter-spacing:-.01em;margin-bottom:6px}
.l-sec .lede{color:var(--muted);max-width:60ch;font-size:16px;margin-bottom:24px}
.l-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.l-step{background:var(--surface);border-radius:var(--r-l);padding:22px}
.l-step .n{width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;margin-bottom:14px;font-family:var(--display)}
.l-step h3{font-size:18px;margin-bottom:6px}
.l-step p{color:var(--muted);font-size:14.5px}
.l-about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
.l-about.one{grid-template-columns:minmax(0,1fr);max-width:760px}
.l-about .quote{font-family:var(--display);font-size:22px;line-height:1.35;letter-spacing:-.01em}
.l-about .who{color:var(--muted);margin-top:12px;font-size:14.5px}
.l-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.l-stats div{background:var(--surface);border-radius:var(--r-l);padding:18px}
.l-stats b{display:block;font-family:var(--display);font-size:30px;color:var(--primary)}
.l-stats span{font-size:13px;color:var(--muted)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:16px 0;font-weight:600;font-size:16px;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--muted);font-weight:400;font-size:22px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{color:var(--muted);padding-bottom:16px;max-width:70ch}
.foot{border-top:1px solid var(--line);margin-top:40px;padding:28px 0 8px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}
.foot a{color:var(--muted);text-decoration:none}.foot a:hover{color:var(--primary)}
.foot .brand{font-family:var(--display);font-weight:600;color:var(--fg);font-size:15px}
@media (max-width:900px){.l-hero{grid-template-columns:minmax(0,1fr);padding:16px 0 32px}.l-shot{display:none}.l-steps,.l-about,.l-stats{grid-template-columns:minmax(0,1fr)}}

/* Desk (returning home) */
.desk{max-width:var(--maxw);margin:0 auto}
.desk-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.desk-head h1{font-size:30px;letter-spacing:-.01em}
.desk-head p{color:var(--muted);margin-top:4px}
.next{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,1fr);gap:16px;margin-bottom:28px}
.next .card.tint{display:flex;flex-direction:column;gap:12px;justify-content:center;padding:26px 28px;border-radius:24px}
.next .card.tint h2{font-size:24px;line-height:1.2}
.next .card.tint p{opacity:.9;max-width:50ch}
.next .card.tint .btn-filled{align-self:flex-start}
.next .mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:900px){.next .mini{grid-template-columns:1fr 1fr}}
.next .mini a{background:var(--surface);border-radius:var(--r-l);padding:16px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
.next .mini a:hover{box-shadow:var(--shadow-1)}
.next .mini svg{width:22px;height:22px;color:var(--primary)}
.next .mini b{font-size:14px}
.next .mini span{font-size:12.5px;color:var(--muted)}
.rowcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.rcard{background:var(--surface);border-radius:var(--r-l);padding:12px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--fg);transition:box-shadow .15s}
.rcard:hover{box-shadow:var(--shadow-2)}
.rcard .nm{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .mt{font-size:12.5px;color:var(--muted)}
.rcard.add{align-items:center;justify-content:center;border:2px dashed var(--line-strong);background:transparent;min-height:160px;color:var(--muted);font-weight:500}
.jcard{background:var(--surface);border-radius:var(--r-l);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.jcard .t{font-weight:600}
.toolsec{margin:34px 0 10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.toolsec h2{font-size:20px}
.toolsec span{color:var(--muted);font-size:14px}
.toollist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tl{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:var(--r-l);padding:12px 14px;text-decoration:none;color:var(--fg);transition:box-shadow .15s;position:relative}
.tl:hover{box-shadow:var(--shadow-1)}
.tl .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--primary-soft);color:var(--on-primary-soft)}
.tl .ico svg{width:22px;height:22px}

function verbForms(base){
  if(IRREG[base])return {base,past:IRREG[base][0],ger:IRREG[base][1]};
  let past,ger;
  if(/ee$/.test(base)){past=base+'d';ger=base+'ing'}
  else if(/ie$/.test(base)){past=base+'d';ger=base.slice(0,-2)+'ying'}
  else if(/e$/.test(base)){past=base+'d';ger=base.slice(0,-1)+'ing'}
  else if(/[^aeiou]y$/.test(base)){past=base.slice(0,-1)+'ied';ger=base+'ing'}
  else if(DBL.has(base)&&/[^aeiouwxy]$/.test(base)){const l=base.slice(-1);past=base+l+'ed';ger=base+l+'ing'}
  else if(/c$/.test(base)){past=base+'ked';ger=base+'king'}
  else {past=base+'ed';ger=base+'ing'}
  return {base,past,ger};
}

const _pe=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PLAYBOOK=[
 {id:'rule',title:'The six-second rule',html:`
<p>A recruiter will look at your résumé for about six to eight seconds before deciding whether to keep reading. They skim; they do not read. Most résumés never reach an interview. Yours has to make those seconds count.</p>
<p>Four principles follow from that:</p>
<ul>
<li><b>Time.</b> Everything important must be visible in a skim: the header, the section titles, the first words of each bullet, the numbers.</li>
<li><b>Proof.</b> Do not include anything you cannot back up in an interview. Lying on a résumé gets people eliminated and blacklisted. Keep receipts for your numbers.</li>
<li><b>Marketing.</b> A résumé is a marketing document, not a biography. It answers three questions: What is this person good at? What is their biggest accomplishment? What makes them stand out?</li>
<li><b>Quantify.</b> Numbers make claims believable and memorable. Headcount, dollars, percentages, hours, views, customers served.</li>
</ul>
<blockquote>Do this: <i>Managing a team of 9 project managers.</i><br>Not this: <i>Managing a team of 9 project managers who focused on creating projects and programs that create projects that improve student life.</i></blockquote>`},
 {id:'rules',title:'Ground rules',html:`
<ol>
<li><b>One page.</b> Especially in college and early career. A second page is not worth your time and is not best practice in most situations.</li>
<li><b>One column, no graphics.</b> No headshots, logos, icons, or multi-column layouts. Clean beats creative. Software that reads résumés (ATS) also reads one column best.</li>
<li><b>One line per bullet.</b> Short, sharp, quantified. If it wraps, cut words.</li>
<li><b>Start every bullet with an action verb.</b> Led, Built, Launched, Analyzed. Never "Responsible for".</li>
<li><b>Show the result.</b> "Worked on marketing campaigns" becomes "Increased campaign engagement 32% across 5,000 users".</li>
<li><b>Tense.</b> Present tense for a current role (Managing), past tense for a past role (Managed).</li>
<li><b>Order.</b> Company, Position, Location, Dates. Keep it identical for every entry.</li>
<li><b>Consistency.</b> Same date format, same punctuation, same bold and italic rules all the way down.</li>
</ol>`},
 {id:'sections',title:'Section by section',html:`
<h4>Header</h4><p>Name, email, phone, city and state (your general area, not a street address), and a link if you have one (LinkedIn, portfolio, GitHub). A one-line headline helps when it tells the reader what you are: "Senior Honors Finance Student", "Associate Financial Analyst at Google".</p>
<h4>Education</h4><p>Lead with it while you are in school or within a year of graduating. University, degree, graduation year. Include your GPA if it is about 3.4 or higher; below that, leave it off even if you are very involved. Honors, relevant coursework, and study abroad go on one note line.</p>
<h4>Employment or Experience</h4><p>Internships, jobs, research, freelance work, family business, caregiving, campus jobs. Three bullets each. Each bullet: verb, what you did, for whom or with what, and the number. Current roles in present tense.</p>
<h4>Leadership and Activities</h4><p>Clubs, student government, teams, campus media, Greek life. Write them exactly like jobs. "Member" is not a bullet; what you did as a member is.</p>
<h4>Projects</h4><p>Anything you built that produced something real: an app with users, a business with revenue, a video series with views, a case competition with a placement. Especially important in tech and creative fields.</p>
<h4>Awards</h4><p>Name, issuer, date, and one line on why. Total multi-year scholarships: $15,000 a year for four years is a $60,000 award.</p>
<h4>Skills</h4><p>Grouped (Tools, Languages, Certifications). List what you can be tested on. Leave out soft skills; the bullets prove those.</p>
<h4>Summary</h4><p>Most students should skip it. Career changers and experienced people may use two lines to translate their background.</p>
<h4>Leave off</h4><p>Photos, full street address, references or "references available on request", objective statements, and anything from high school unless it directly supports the story (see the FAQ).</p>`},
 {id:'empty',title:'"My résumé is empty." No it is not.',html:`
<p>Almost nobody has nothing. If you are stuck, you probably have some of these and have not counted them:</p>
<ul><li>Community service and volunteer hours</li><li>Campus jobs, retail, food service, gig work</li><li>Caregiving for family, or helping run a family business</li><li>A small business, reselling, freelance work</li><li>Clubs and organizations, even as a new member with a task</li><li>Class projects with real deliverables, hackathons, case competitions</li><li>Content you make: videos, a podcast, a newsletter</li><li>Externships, job shadowing, campus consulting</li><li>Languages, certifications, software you actually use</li></ul>
<p>Open the <a href="#finder" data-go="finder">Experience Finder</a>. It walks through all of these and drafts the entries for you. Then make your own opportunities: start the club, pitch the professor on research, offer to run a friend's social media for a month and track the numbers.</p>`},
 {id:'story',title:'Build the story, then the résumé (Rashad’s notes)',html:`
<p>The goal of your life should not be a solid résumé. Build an interesting story and a set of experiences that make you unique and marketable, and the résumé falls into place. You are selling you, not the document.</p>
<p>Being intentional about your résumé is one of the smartest things you can do. If you take a role to build your résumé, still give it everything. Someone else needed that spot, and you should put your best foot forward in any role.</p>
<h4>How I did it</h4>
<ul>
<li>I chose a major that would pay well regardless of the specific role.</li>
<li>Get involved early. Anything works. Explore. As a freshman I joined things on campus so I would have something to show when internship applications opened.</li>
<li>Freshman year I was a photographer for the business school council, for student government, and for a campus modeling organization, because I thought I wanted to be a photographer for the rest of my life. Doing that work for free led to a paid photography position the following summer. I changed direction later, but the free campus work gave me a foundation.</li>
<li>Instead of only job experiences, I filled my résumé with smaller projects I created myself or with my team. Not traditional, but it made a compelling story.</li>
<li>Find someone at your school who has worked where you want to work and follow their path.</li>
</ul>`},
 {id:'rewrite',title:'Before and after',html:`<p>Every one of these is a real kind of bullet people write, and what it becomes once it has a verb, a number, and a result.</p>`+BEFORE_AFTER.map(x=>`<div class="ba"><div class="b"><span class="tag">Before</span>${_pe(x.b)}</div><div class="a"><span class="tag">After</span>${_pe(x.a)}</div><div class="why">${_pe(x.why)}</div></div>`).join('')+`<p>In the Résumé workspace, the lightning button on any bullet opens 240 verbs in the right tense, and the Check flags the weak openers for you.</p>`},
 {id:'master',title:'One master, many versions',html:`
<p>Most people keep one résumé and rewrite it under pressure the night before a deadline. Keep two kinds instead.</p>
<p><b>The master</b> has everything you have ever done: every job, every bullet, every award, even the ones that will never make a one-page cut. It is allowed to run three pages. Nobody sees it but you. When something new happens, it goes on the master first.</p>
<p><b>Versions</b> are built from the master in minutes. A marketing version. A nonprofit version. A version for one posting at Google. You do not retype anything: open <b>Choose what goes in</b>, tick the experiences and bullets that audience should see, drag them into order, and Receipts formats the page. Tag each version for what it is for, and the Library reads like a shelf.</p>
<p>Three habits make this work: add to the master the week something happens, while you still remember the numbers; never edit a version by hand when the change belongs on the master; and before any application, run the Check on the version, not the master.</p>`},
 {id:'network',title:'Your network book',html:`
<p>Every opportunity Rashad got came through a person before it came through a portal. The résumé gets you considered; the relationship gets you remembered. So keep the people as carefully as the document.</p>
<p>The <b>Network Book</b> is a page per person: how you met, what they care about, what they told you, and a rating from 1 to 5. The rating is not how important they are; it is how real the relationship is. A 1 met you once. A 3 has helped once. A 5 would make a call on your behalf without being asked.</p>
<ul><li>Add the person the same day. Write the one specific thing they said.</li><li>Every real contact gets logged with a next step and a date. Monday morning, sort by follow-up.</li><li>Thank-you within 24 hours. Report back in three weeks. Those two messages are where most people quietly drop out.</li><li>Every quarter, the 4s and 5s get a short update with no ask attached.</li><li>Rate honestly and in private. The point is to know who to call, not to feel good about a list.</li></ul>
<p>Export the whole book to Google Sheets or Excel whenever you want it somewhere else; it is yours.</p>`},
 {id:'faq',title:'FAQ',html:`
<h4>How far back can I go?</h4><p>As an underclassman, if you need to reach into high school, make it worth it. If you want to work in international affairs and you founded an international affairs organization in high school, that shows intention, long-term interest, and initiative. A high-school part-time job is fine for a first-year; drop it once you have college experience.</p>
<h4>PDF or Word?</h4><p>Send a PDF unless the application asks for Word. Name the file <code>Firstname_Lastname_Resume.pdf</code>. Keep a Word version for recruiters who ask to edit.</p>
<h4>What about applicant tracking systems?</h4><p>They read one-column text well and struggle with tables, columns, text boxes, and images. The Classic, Minimal, and Modern themes here are safe. The plain-text export is what a parser would see; if it reads sensibly top to bottom, you are fine.</p>
<h4>Graduate and law school résumés?</h4><p>Different rules. Many programs allow two pages, want hours per week, and care most about research, writing, and analysis. Read each program's instructions and build a separate version in the Library.</p>
<h4>Gaps?</h4><p>Do not explain them on the résumé. Fill them with what you did (caregiving, a project, coursework) if it is real, and be ready to talk about them plainly in the interview.</p>
<h4>Should I tailor for each job?</h4><p>Yes, and it should take minutes, not an evening. Keep one master with everything you have ever done. For each job, paste the posting into Tailor to a Job, then <b>Choose what goes in</b>: tick the experiences and bullets that posting should see, drag them into order, and Receipts formats the copy. The master never changes, so the next job starts from everything again.</p>`},
 {id:'watch',title:'Watch & learn',html:`
<p>Rashad posts career advice on TikTok as <b>@rashadtheintern</b> and on Instagram as <b>@rashadoliver</b>. Start with the video he calls "the weekend project that will change your life."</p>

const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const SEASONS={spring:3,summer:6,fall:9,autumn:9,winter:12};
function monthIndex(w){w=String(w||'').toLowerCase().replace(/\./g,'');if(w.length<3)return -1;return MONFULL.findIndex(f=>f.toLowerCase().startsWith(w.slice(0,3)))}
function parseDateInput(s){
  s=String(s||'').trim().replace(/​/g,'');if(!s)return '';
  if(/^\d{4}-\d{2}$/.test(s))return s;
  if(/^\d{4}$/.test(s))return s;
  let m;
  if(/^(present|current|now|ongoing|today)$/i.test(s))return 'current';
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{4})$/)))return m[2]+'-'+pad2(m[1]);
  if((m=s.match(/^(\d{4})[\/.\-](\d{1,2})$/)))return m[1]+'-'+pad2(m[2]);
  if((m=s.match(/^([A-Za-z]+)\.?,?\s+(\d{4})$/))){const mi=monthIndex(m[1]);if(mi>=0)return m[2]+'-'+pad2(mi+1);if(SEASONS[m[1].toLowerCase()])return titleCase(m[1])+' '+m[2]}
  if((m=s.match(/^(?:expected|exp\.?|anticipated|class of|graduating)\s+(.*)$/i)))return parseDateInput(m[1]);
  return s;
}
function dateParts(t){let m;if(!t)return null;if((m=/^(\d{4})-(\d{2})$/.exec(t)))return {y:+m[1],m:+m[2]};if((m=/^(\d{4})$/.exec(t)))return {y:+m[1],m:null};if((m=/^(Spring|Summer|Fall|Autumn|Winter)\s+(\d{4})$/i.exec(t)))return {y:+m[2],m:SEASONS[m[1].toLowerCase()],season:titleCase(m[1])};return null}
function dateNum(t){const p=dateParts(t);return p?p.y*12+(p.m||6):null}
function fdate(t,fmt){const p=dateParts(t);if(!p)return t==='current'?'Current':(t||'');if(p.season)return p.season+' '+p.y;if(p.m==null)return String(p.y);const mi=p.m-1;if(fmt==='full')return MONFULL[mi]+' '+p.y;if(fmt==='num')return pad2(p.m)+'/'+p.y;if(fmt==='year')return String(p.y);return MON3[mi]+(MONFULL[mi].length>3?'.':'')+' '+p.y}
function dateDisplay(t){const p=dateParts(t);if(!p)return t==='current'?'Current':(t||'');if(p.season)return p.season+' '+p.y;if(p.m==null)return String(p.y);return MONFULL[p.m-1]+' '+p.y}
function range(it,fmt){const a=fdate(it.start,fmt),b=it.current?'Current':fdate(it.end,fmt);if(a&&b&&a!==b)return a+' – '+b;return a||b}

function relTime(iso){if(!iso)return '';const d=(Date.now()-new Date(iso).getTime())/1000;if(d<60)return 'just now';if(d<3600)return Math.floor(d/60)+' min ago';if(d<86400)return Math.floor(d/3600)+' h ago';if(d<86400*30)return Math.floor(d/86400)+' d ago';return new Date(iso).toLocaleDateString()}

function insertVerb(ta,verb){const v=ta.value;const pos=ta.selectionStart||0;const lineStart=v.lastIndexOf('\n',pos-1)+1;let lineEnd=v.indexOf('\n',pos);if(lineEnd<0)lineEnd=v.length;const line=v.slice(lineStart,lineEnd);const fw=firstWord(line);let newLine;if(!line.trim())newLine=verb+' ';else if(fw&&(wordTense(fw)!=='none'||WEAK_START.test(fw)))newLine=verb+line.slice(fw.length);else newLine=verb+' '+line.replace(/^\s+/,'').replace(/^[a-z]/,c=>c);ta.value=v.slice(0,lineStart)+newLine+v.slice(lineEnd);const np=lineStart+newLine.length;ta.setSelectionRange(np,np);ta.focus();ta.dispatchEvent(new Event('input',{bubbles:true}))}

/* Fit to one page: step through safe adjustments, measuring after each, and stop as soon as it fits */
function fitToOnePage(r){const s=r.settings;s.c=s.c||{};const changed=[];const e=()=>effectiveSettings(r);let pages=measurePages(r);const fits=()=>pages<=1.0;
  const step=(label,fn)=>{if(fits())return;const before=JSON.stringify(s);fn();const p2=measurePages(r);if(p2<pages){pages=p2;if(!changed.includes(label))changed.push(label)}else{Object.assign(s,JSON.parse(before))}};
  const dec=(k,min,by,label)=>{for(let i=0;i<14&&!fits();i++){const cur=+e()[k];if(cur-by<min-1e-9)break;step(label,()=>{s.c[k]=Math.round((cur-by)*100)/100})}};
  const sides=['mt','mb','ml','mr'];const decMargin=(min)=>{for(let i=0;i<8&&!fits();i++){const ev=e();const vals=sides.map(k=>+ev[k]);if(Math.max(...vals)-0.05<min-1e-9)break;step('margins',()=>{const custom=sides.some(k=>s.c[k]!=null&&s.c[k]!=='');if(custom)sides.forEach((k,j)=>{s.c[k]=Math.round(Math.max(min,vals[j]-0.05)*100)/100});else s.margin=Math.round(Math.max(min,(s.margin||0.7)-0.05)*100)/100})}};
  const decFont=(min)=>{for(let i=0;i<8&&!fits();i++){const cur=s.fontSize||10.5;if(cur-0.25<min-1e-9)break;step('font size',()=>{s.fontSize=Math.round((cur-0.25)*100)/100})}};
  /* Pass 1: the adjustments a careful designer makes first. Pass 2: tighter floors only if still over. */
  decMargin(0.6);dec('lh',1.18,0.03,'line height');dec('sg',5,1,'section spacing');dec('ig',2,0.5,'entry spacing');decFont(10);
  decMargin(0.5);dec('lh',1.12,0.03,'line height');dec('sg',3,1,'section spacing');dec('ig',1,0.5,'entry spacing');dec('headGap',1,1,'heading spacing');decFont(9.5);
  return {fits:fits(),pages,changed}}

async function importFiles(files){const f=files[0];if(!f)return;const name=f.name.toLowerCase();

      ${s.items.map(it=>{const T=TYPES[s.type]||TYPES.custom;if(T.single)return `<div class="oent">${esc(it.desc)}</div>`;if(T.skills)return `<div class="oent"><b>${esc(it.org)}</b>: ${esc(it.desc)}</div>`;const bl=bulletList(it);return `<div class="oent"><b>${esc(it.org||'(no organization)')}</b>${it.role?' — '+esc(it.role):''}${it.loc?' <span class="m">· '+esc(it.loc)+'</span>':''} <span class="m">${esc(range(it,'abbr'))}</span>${bl.length?`<ul>${bl.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}${it.desc?`<div class="m small">${esc(it.desc)}</div>`:''}</div>`}).join('')}</div>`}).join('')}

  </div>
  <div class="dlg-actions"><button class="btn btn-outline" id="ri-back">Start over</button><button class="btn btn-filled" id="ri-ok">Import as a new résumé</button></div>`,{wide:true});
  $$('[data-rtab]',root).forEach(b=>b.onclick=()=>{IMPORT.tab=b.dataset.rtab;drawImportReview()});
  $$('[data-tag]',root).forEach(sel=>sel.onchange=()=>{IMPORT.overrides[+sel.dataset.tag]=sel.value;const sc=$('.lines',root).scrollTop;drawImportReview();const L=$('.lines');if(L)L.scrollTop=sc});

  $('#ri-back',root).onclick=()=>openImportDialog('upload');
  const cur=activeResume();const replaceBlank=cur&&resumeIsBlank(cur)&&!cur.sample;$('#ri-ok',root).textContent=replaceBlank?'Import':'Import as a new résumé';
  $('#ri-ok',root).onclick=()=>{const nm=(data.basic.name?data.basic.name+'’s résumé':'Imported résumé');let r;if(replaceBlank){const w=withIds(data);cur.basic=w.basic;cur.sections=w.sections;cur.name=nm;cur.source='import';r=cur}else{r=newResume(data,nm,'import')}r.sourceText=lines.map(l=>(l.bullet?'• ':'')+l.t).join('\n');save(['meta','resume']);closeDialog();toast('Imported. Check dates and sections, then run the Check.');go('builder')}}
