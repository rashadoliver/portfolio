const STOP=new Set('a an the and or of to in on for with at by from as is are be been being was were this that these those it its into your you we our their they them he she his her will shall can may must should would could have has had do does did not no yes if then than so such via per about across after before during under over between within without while where when which who whom whose what why how all any each every some most more less many much other another same own new old also well very just only even both either neither one two three first second third etc role team work working including include includes ability able strong excellent experience experienced skills skill required preferred plus years year degree bachelor related relevant knowledge understanding environment opportunity opportunities candidate candidates position job responsibilities responsibility qualifications requirements benefits company us please apply applicants equal employer status'.split(/\s+/));
function extractKeywords(text){const counts={};const t=String(text||'');const caps=t.match(/\b[A-Z][A-Za-z0-9+#.]{1,}(?:\s+[A-Z][A-Za-z0-9+#.]{1,}){0,2}\b/g)||[];caps.forEach(c=>{let ws=c.trim().split(' ');while(ws.length&&STOP.has(ws[0].toLowerCase()))ws.shift();while(ws.length&&STOP.has(ws[ws.length-1].toLowerCase()))ws.pop();const k=ws.join(' ');if(!k||k.length<3)return;counts[k]=(counts[k]||0)+1.5});
  (t.toLowerCase().match(/\b[a-z][a-z0-9+#.\-]{2,}\b/g)||[]).forEach(w=>{if(STOP.has(w)||/^\d/.test(w))return;counts[w]=(counts[w]||0)+1});
  return Object.entries(counts).filter(([k,v])=>v>=2||/[A-Z]/.test(k)).sort((a,b)=>b[1]-a[1]).map(([k])=>k).filter((k,i,arr)=>!arr.slice(0,i).some(p=>p.toLowerCase()===k.toLowerCase())).slice(0,24)}
function coverChecks(r){const c=r.cover;const body=String(c.body||'');const w=wordCount(body);const out=[];const sents=body.split(/(?<=[.!?])\s+/).filter(x=>x.trim());const iStarts=sents.filter(s=>/^I\b/.test(s.trim())).length;
  out.push([w>=200&&w<=380?'ok':'warn',`${w} words`,w<200?'Aim for 220–350. Add one concrete story.':w>380?'Over 350. Cut the paragraph that repeats the résumé.':'Good length.']);
  if(c.company)out.push([new RegExp(c.company.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i').test(body)?'ok':'warn','Company named in the body',`Mention ${c.company} and one specific thing about them.`]);
  out.push([/to whom it may concern/i.test(c.greeting+body)?'bad':'ok','Greeting','“To whom it may concern” signals no research. Find a name or use “Dear Hiring Manager,”.']);
  out.push([/i am writing to (apply|express)/i.test(body)?'warn':'ok','Opening line',/i am writing to (apply|express)/i.test(body)?'“I am writing to apply” is the most common first line in the stack. Start with the hook instead.':'No stock opener.']);
  out.push([/\d/.test(body)?'ok':'warn','At least one number',/\d/.test(body)?'Has numbers.':'Add one quantified result from your résumé.']);
  out.push([sents.length&&iStarts/sents.length>0.6?'warn':'ok','Sentence openers',sents.length&&iStarts/sents.length>0.6?`${iStarts} of ${sents.length} sentences start with “I”. Vary them.`:'Good variety.']);
  out.push([/interview|conversation|discuss|meet|call|speak/i.test(body)?'ok':'warn','Ends with an ask','Ask for the conversation in the last paragraph.']);
  return out}

function lorState(){S.letters=S.letters||{};S.letters.recs=S.letters.recs||[];S.letters.email=S.letters.email||{tone:'warm'};S.letters.brag=S.letters.brag||{moments:[{},{},{}],qual:[]};return S.letters}
function lorEmail(e,you){const name=e.recName||'[Name]';const greet=e.tone==='formal'?`Dear ${name},`:`Hi ${name},`;const rel=e.relationship||'[how you know each other, e.g. your Financial Modeling course in fall 2025]';const mem=e.memory?` I still think about ${e.memory.replace(/\.$/,'')}, and it is a big part of why I am asking you.`:'';
  const req=`Subject: Recommendation letter request — ${you}

${greet}

${e.personal||'I hope things are going well on your end.'}

I am applying to ${e.applyingTo||'[program or role]'}${e.deadline?`, and letters are due ${e.deadline}`:''}. Our time together in ${rel} is exactly the kind of experience I hope the application shows.${mem}

Would you feel comfortable writing me a strong letter of recommendation? If yes, I will send a one-page summary of what I have been doing, my résumé, a few specific moments from our work together that might be useful, and the submission details, so it takes as little of your time as possible. If the timing does not work, I completely understand.

Thank you for considering it.

${you}${e.contact?'\n'+e.contact:''}`;
  const follow=`Subject: Thank you — materials for my recommendation letter

${greet}

Thank you again for agreeing to write on my behalf. A few things to make it easy:

• Deadline: ${e.deadline||'[date]'}${e.how?`\n• How to submit: ${e.how}`:'\n• How to submit: [portal link or email; you will receive an email with instructions]'}
• Attached: my résumé and a one-page brag sheet with specific moments from ${rel}
• What I am applying to and why: ${e.applyingTo||'[one or two lines]'}

If anything else would help, tell me and I will send it the same day. I will check in a week or so before the deadline.

With appreciation,
${you}`;
  const remind=`Subject: Quick check-in — recommendation letter due ${e.deadline||'[date]'}

${greet}

A gentle reminder that the letter for ${e.applyingTo||'[program or role]'} is due ${e.deadline||'[date]'}. If you need anything from me, I am happy to resend the résumé or brag sheet.

Thank you again,
${you}`;
  const thanks=`Subject: Thank you

${greet}

I saw that your letter was submitted. Thank you for taking the time; it means a great deal to have your support. I will let you know how things turn out.

Gratefully,
${you}`;
  return {req,follow,remind,thanks}}
function bragSheet(b,you,recName){const q=LOR.qualities;const lines=[`BRAG SHEET — ${you} for ${recName||'[recommender]'}`,'',`What I am applying to and why`,b.goals||'[Two or three sentences]','',`How we know each other`,b.relationship||'[Course or role, dates, what you did together]','',`Moments you might remember`];
  (b.moments||[]).forEach((mo,i)=>{if(mo.sit||mo.act||mo.res)lines.push(`${i+1}. ${mo.sit||''}${mo.act?' — '+mo.act:''}${mo.res?' — '+mo.res:''}`)});
  lines.push('',`Grades or performance`,b.perf||'[Grade in the course, project results, reviews]','',`Qualities I hope you can speak to (with evidence)`);
  (b.qual||[]).forEach(k=>{const qd=q.find(x=>x[0]===k);lines.push(`• ${k}: ${(b.evidence||{})[k]||'['+(qd?qd[1]:'example')+']'}`)});
  lines.push('',`Logistics`,`Deadline: ${b.deadline||'[date]'}`,`Submit via: ${b.how||'[portal / email]'}`,b.link?`Link: ${b.link}`:'',`Attached: résumé${b.statement?', personal statement draft':''}`,'','Thank you.');
  return lines.filter(x=>x!==undefined).join('\n')}
VIEWS.letters=function(m,sub){sub=sub||'ask';const L=lorState();const r=activeResume();const you=r.basic.name||'[Your name]';
  let body='';
  if(sub==='ask')body=`<div class="twocol"><div class="stack prose">
    <div class="card"><h3>Who to ask</h3><table class="table" style="margin-top:6px"><thead><tr><th>Ask</th><th>They can speak to</th></tr></thead><tbody>${LOR.who.map(w=>`<tr><td><b>${esc(w[0])}</b></td><td>${esc(w[1])}</td></tr>`).join('')}</tbody></table><p class="small muted" style="margin-top:8px">A famous name who barely knows you writes a short, vague letter. A person who watched you work writes a specific one. Specific wins.</p></div>

    <div class="card"><h3>How to ask</h3><ol><li>Ask in person or on a call if you can; email is the follow-up, not the ask. If email is the only option, keep it short and make yes easy.</li><li>Ask for a <b>strong</b> letter: “Do you feel you know my work well enough to write a strong letter?” It gives them a graceful out, and a lukewarm letter hurts more than no letter.</li><li>Say what you are applying to, when it is due, and why you are asking them specifically.</li><li>Promise to make it easy: résumé, brag sheet, deadline, submission details, all in one email.</li><li>After yes: send the materials within a day. Remind two weeks before the deadline. Thank them within 48 hours of submission, and tell them the outcome.</li></ol></div></div>

/* ---------- Kit helpers ---------- */
const aAn=s=>/^[aeiou]/i.test(s)?'an':'a';const listJoin=a=>a.length<=1?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];const capFirst=s=>s?s[0].toUpperCase()+s.slice(1):s;
function draftAbout(r,k){const b=r.basic;const first=(b.name||'').split(' ')[0]||'They';const pr=k.pronoun;const [subj,poss,be,has]=pr==='he'?['he','his','is','has']:pr==='she'?['she','her','is','has']:pr==='name'?[first,first+'’s','is','has']:['they','their','are','have'];
  const emp=r.sections.find(s=>s.type==='employment');const cur=emp?emp.items.find(it=>it.current&&it.org):null;const past=[...new Set((emp?emp.items.filter(it=>!it.current&&it.org):[]).map(it=>it.org))].slice(0,4);const aw=(r.sections.find(s=>s.type==='awards')||{items:[]}).items.filter(it=>it.org).map(it=>it.org).slice(0,2);
  const trio=[k.h1,k.h2,k.h3].filter(Boolean);const tr=trio.length?listJoin(trio.map(x=>x.toLowerCase())):'';const loc=(k.location||b.location||'').replace(/\.$/,'');
  let s=`${b.name||'Your name'} is ${tr?aAn(tr)+' '+tr:'a professional'}${loc?' based in '+loc:''}.`;
  if(cur){const fb=bulletList(cur)[0];s+=` ${capFirst(subj)} currently work${pr==='they'?'':'s'} at ${cur.org}${cur.role?' as '+aAn(cur.role)+' '+cur.role.split(',')[0]:''}.`;if(fb)s+=` Recent highlight: ${fb.replace(/\.$/,'')}.`}
  if(past.length)s+=` ${capFirst(poss)} previous experience includes ${listJoin(past)}.`;
  if(aw.length)s+=` ${capFirst(subj)} ${has} been recognized with the ${listJoin(aw)}.`;
  s+=` ${k.cta||('Reach out to collaborate or to talk about '+(trio[0]?trio[0].toLowerCase():'the work')+'.')}`;return s}

/* ---------- Offer navigator ---------- */
function negoState(){const n=S.nego;n.levers=n.levers||[];n.checks=n.checks||[];return n}
const money=v=>v?'$'+Math.round(+v).toLocaleString():'';
VIEWS.negotiate=function(m,sub){const n=negoState();sub=sub||'numbers';
  const num=v=>+String(v||'').replace(/[^0-9.]/g,'')||0;
  const bar=()=>{const pts=[['base','Walk-away',num(n.baseline)],['offer','Offer',num(n.offer)],['target','Target',num(n.target)],['ask','Ask',num(n.ask)]].filter(p=>p[2]>0);if(pts.length<2)return '<p class="small muted">Enter at least two numbers to see them on a line.</p>';const vals=pts.map(p=>p[2]);const lo=Math.min(...vals)*0.96,hi=Math.max(...vals)*1.04;return `<div class="numbar"><div class="track"></div>${pts.map(p=>`<div class="pt ${p[0]}" style="left:${((p[2]-lo)/(hi-lo)*100).toFixed(1)}%"><i>${esc(p[1])}</i><em>${money(p[2])}</em></div>`).join('')}</div>`};
  const fill=s=>s.replace(/\$\[ask\]/g,n.ask?money(n.ask):'$[ask]').replace(/\$\[target\]/g,n.target?money(n.target):'$[target]').replace(/\$\[low\]/g,n.low?money(n.low):'$[low]').replace(/\$\[high\]/g,n.high?money(n.high):'$[high]').replace(/\$\[number\]/g,n.other?money(n.other):'$[number]').replace(/\$\[amount\]/g,n.signing?money(n.signing):'$[amount]').replace(/\[city\]/g,n.city||'[city]').replace(/\[Company\]/g,n.company||'[Company]');

  const myLevers=n.levers.map(i=>NEGO.levers[i]).filter(Boolean);
  const script=`"Thank you again for the offer${n.company?' from '+n.company:''}. I am excited about ${n.role||'the role'} and I want to make this work.${n.low&&n.high?` Based on my research, comparable roles${n.city?' in '+n.city:''} pay between ${money(n.low)} and ${money(n.high)}`:' Based on my research and the scope of the role'}${n.other?`, and I have another offer at ${money(n.other)}`:''}. I was expecting a base closer to ${n.ask?money(n.ask):'$[ask]'}. Is there flexibility to get there?"\n\n(Stop. Let them answer.)\n\nIf base is fixed: "I understand the band. Could we look at ${myLevers.length?listJoin(myLevers.map(l=>l[0].toLowerCase())):'a signing bonus and a six-month review'}${n.signing?` — for example a signing bonus of ${money(n.signing)}`:''}?"\n\nClose: "If we can get there, I am ready to accept this week. Could you send the updated letter?"`;
  let body='';
  if(sub==='numbers')body=`<div class="twocol"><div class="stack" id="nform"><div class="card"><h3>The offer</h3><div class="grid2" style="margin-top:8px">${fieldHTML('Company','company',n.company||'',{})}${fieldHTML('Role','role',n.role||'',{})}${fieldHTML('Base salary offered','offer',n.offer||'',{ph:'72000',attrs:'inputmode="numeric"'})}${fieldHTML('Bonus / other comp offered','bonusText',n.bonusText||'',{ph:'5% target bonus, $3,000 signing'})}${fieldHTML('City','city',n.city||'',{})}<label class="check"><input type="checkbox" data-k="internship" ${n.internship?'checked':''}><span>This is an internship</span></label></div></div>
    <div class="card"><h3>Your research</h3><p class="small muted">Three sources: the posted range, alumni or peers in the role, and salary data sites. Note where they disagree.</p><div class="grid3" style="margin-top:8px">${fieldHTML('Market low','low',n.low||'',{attrs:'inputmode="numeric"'})}${fieldHTML('Market mid','mid',n.mid||'',{attrs:'inputmode="numeric"'})}${fieldHTML('Market high','high',n.high||'',{attrs:'inputmode="numeric"'})}</div></div>
    <div class="card"><h3>Your numbers</h3><p class="small muted">Decide these before the call and write them down. The ask sits a little above the target so there is room to land on it.</p><div class="grid3" style="margin-top:8px">${fieldHTML('Walk-away (lowest you accept)','baseline',n.baseline||'',{attrs:'inputmode="numeric"'})}${fieldHTML('Target (happy)','target',n.target||'',{attrs:'inputmode="numeric"'})}${fieldHTML('Ask (what you say)','ask',n.ask||'',{attrs:'inputmode="numeric"',help:'Blank = target + 7%'})}${fieldHTML('Competing offer (if any)','other',n.other||'',{attrs:'inputmode="numeric"'})}${fieldHTML('Signing bonus to ask for','signing',n.signing||'',{attrs:'inputmode="numeric"'})}</div><div id="nbar">${bar()}</div>${n.notes?`<div class="callout" style="margin-top:10px;white-space:pre-wrap">${ICONS.mic}<div>${esc(n.notes)}</div></div>`:''}${n.internship?'<div class="callout" style="margin-top:10px">'+ICONS.info+'<div>Intern pay is often set program-wide. Ask instead about a housing or relocation stipend, transit, start date, and team placement, and ask what the conversion offer typically looks like.</div></div>':''}</div></div>
    <div class="sticky stack"><div class="card"><div class="row" style="justify-content:space-between"><h3>Your counter, on the call</h3><button class="btn btn-tonal sm" id="ncopy">${ICONS.copy} Copy</button></div><pre class="pre" id="nscript" style="margin-top:8px">${esc(script)}</pre></div><div class="card"><h3>Levers to add</h3><p class="small muted">Pick two or three. They go into the script.</p><div style="margin-top:6px">${leverList}</div></div></div></div>`;
  else if(sub==='principles')body=`<div class="toolgrid">${NEGO.principles.map(p=>`<div class="card"><h3>${esc(p[0])}</h3><p class="small">${esc(p[1])}</p></div>`).join('')}</div>`;
  else if(sub==='scripts')body=`<div class="stack">${NEGO.scripts.map((s,i)=>`<details class="acc" ${i===0?'open':''}><summary>${esc(s[0])}</summary><div class="acc-body"><p class="prose">${esc(fill(s[1]))}</p><button class="btn btn-text sm" data-scopy="${i}">${ICONS.copy} Copy</button></div></details>`).join('')}<div class="card note"><h3>Walking away</h3><p class="small">Only say the walk-away line if the number is real. Decide it when you are calm, write it down, and do not move it during the call. If you are not willing to walk, negotiate the levers instead and accept with a six-month review in writing.</p></div></div>`;

  m.innerHTML=`<div class="tool">${toolHead('negotiate')}<div style="margin-bottom:16px">${seg([['','Numbers & script'],['principles','Principles'],['scripts','Scripts'],['ready','Checklist']],sub==='numbers'?'':sub,'negotiate')}</div>${body}</div>`;
  if(sub==='numbers'){$('#nform',m).addEventListener('input',e=>{const t=e.target;if(!t.dataset.k)return;n[t.dataset.k]=t.type==='checkbox'?t.checked:t.value;if(t.dataset.k==='target'&&!n.askManual){n.ask=String(Math.round(num(n.target)*1.07/500)*500||'')}if(t.dataset.k==='ask')n.askManual=!!t.value;save(['meta']);go('negotiate',{keepScroll:true,noFocus:true})});$$('[data-lever]',m).forEach(c=>c.onchange=()=>{const i=+c.dataset.lever;const idx=n.levers.indexOf(i);if(idx>=0)n.levers.splice(idx,1);else n.levers.push(i);save(['meta']);go('negotiate',{keepScroll:true,noFocus:true})});$('#ncopy',m).onclick=()=>copyText($('#nscript',m).textContent,'Script copied')}
  if(sub==='scripts')$$('[data-scopy]',m).forEach(b=>b.onclick=()=>copyText(fill(NEGO.scripts[+b.dataset.scopy][1])));
  if(sub==='ready')$$('[data-chk]',m).forEach(c=>c.onchange=()=>{const i=+c.dataset.chk;const idx=n.checks.indexOf(i);if(idx>=0)n.checks.splice(idx,1);else n.checks.push(i);save(['meta']);go('negotiate-ready',{keepScroll:true,noFocus:true})});
};

/* ---------- Portfolio planner ---------- */
function portfolioDefaults(r,k){const b=r.basic;const trio=[k.h1,k.h2,k.h3].filter(Boolean).join(' | ');const emp=(r.sections.find(s=>s.type==='employment')||{items:[]}).items.filter(it=>it.org);const proj=(r.sections.find(s=>s.type==='projects')||{items:[]}).items.filter(it=>it.org);const skills=(r.sections.find(s=>s.type==='skills')||{items:[]}).items.filter(it=>it.desc);
  const cases=[...emp,...proj].map(it=>({it,score:bulletList(it).filter(x=>/\d|\$|%/.test(x)).length})).sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.it);
  const cs=i=>{const it=cases[i];if(!it)return 'Situation: [where you were and what needed doing]\nWhat I did: [two or three actions]\nResult: [the number]\nVisual: [screenshot, photo, or chart]';return `Situation: ${it.org}${it.role?' — '+it.role:''}${it.loc?', '+it.loc:''} (${range(it,'abbr')})\nWhat I did:\n${bulletList(it).map(x=>'• '+x).join('\n')}\nResult: ${bulletList(it).find(x=>/\d|\$|%/.test(x))||'[the number]'}\nVisual: [screenshot, photo, or chart from this work]`};
  return {title:`${b.name}\n${trio||'[Word 1 | Word 2 | Word 3]'}\n${k.site||b.website||''}`.trim(),video:`Script (45–60s):\n0–10s: "I’m ${b.name}, ${trio?aAn(trio)+' '+trio.toLowerCase().replace(/ \| /g,', '):'[what you are]'}."\n10–40s: one story with a number: ${bulletList(cases[0]||{})[0]||'[your best result]'}\n40–60s: "I’m looking for ${'[what you want next]'}. Here’s how to reach me."`,about:k.about||draftAbout(r,k),timeline:emp.map(it=>`${it.org} — ${it.role||''} (${range(it,'abbr')})${bulletList(it)[0]?': '+bulletList(it)[0]:''}`).join('\n')||'[Role — Org (dates): one number]',case1:cs(0),case2:cs(1),case3:cs(2),press:(k.affil||'').split(',').map(x=>x.trim()).filter(Boolean).join('\n')||'[Publication or partner — link]',skills:skills.map(it=>`${it.org}: ${it.desc}`).join('\n')||'[Group: tools]',contact:[b.email,k.site||b.website,k.ig&&'Instagram @'+k.ig.replace(/^@/,''),k.tt&&'TikTok @'+k.tt.replace(/^@/,''),b.linkedin&&'linkedin.com/in/'+b.linkedin,k.cta||'[The one thing you want the viewer to do]'].filter(Boolean).join('\n')}}
VIEWS.portfolio=function(m){const r=activeResume();const k=kitState();S.portfolio.slides=S.portfolio.slides||{};const P=S.portfolio.slides;const d=portfolioDefaults(r,k);
  const outline=()=>PORTFOLIO_SLIDES.map((s,i)=>`## Slide ${i+1} — ${s.name}\n${(P[s.id]&&P[s.id].content!=null?P[s.id].content:d[s.id])||''}\n\n_Speaker notes:_ ${(P[s.id]&&P[s.id].notes!=null?P[s.id].notes:s.notes)||''}`).join('\n\n');
  m.innerHTML=`<div class="tool">${toolHead('portfolio',`<label class="field inline small"><span class="lbl">Résumé</span>${resumeSelectHTML('rsel')}</label>`)}${resumeIsBlank(r)?emptyGuideHTML('The slides are drafted from your résumé.'):''}
  <div class="twocol"><div class="stack" id="pform">${PORTFOLIO_SLIDES.map((s,i)=>`<div class="card pad-s" data-slide="${s.id}"><div class="row" style="justify-content:space-between"><h3>Slide ${i+1} · ${esc(s.name)}</h3><button class="btn btn-text xs" data-reset="${s.id}">Reset to suggested</button></div><p class="small muted">${esc(s.prompt)}</p><label class="field" style="margin-top:8px"><span class="vh">Content</span><textarea data-pc="${s.id}" rows="${s.id.startsWith('case')||s.id==='timeline'||s.id==='video'?6:3}">${esc(P[s.id]&&P[s.id].content!=null?P[s.id].content:d[s.id])}</textarea></label><label class="field" style="margin-top:6px"><span class="lbl">Speaker notes</span><input data-pn="${s.id}" value="${esc(P[s.id]&&P[s.id].notes!=null?P[s.id].notes:s.notes)}"></label></div>`).join('')}</div>
  <div class="sticky stack"><div class="card"><div class="row" style="justify-content:space-between"><h3>Outline</h3><div class="row"><button class="btn btn-tonal sm" id="pcopy">${ICONS.copy} Copy</button><button class="btn btn-text sm" id="pdl">Download .md</button></div></div><pre class="pre" id="pout" style="max-height:40vh;margin-top:8px">${esc(outline())}</pre></div>
    <details class="acc" open><summary>Build it in Google Slides</summary><div class="acc-body prose small"><ol><li>New blank deck, 16:9. Paste each slide title as the slide title and the content into the body; notes go in the speaker-notes pane.</li><li>Intro video: record on your phone, upload to Drive, then Insert → Video → Google Drive. Set it to autoplay in Format options.</li><li>Case-study visuals: a screenshot, a photo of you doing the work, or a one-number chart. One visual per slide.</li><li>Share → Anyone with the link → Viewer. Put that link in your résumé header and networking kit.</li><li>Rashad's own deck is the reference: <a href="https://docs.google.com/presentation/d/1Vi5Zvc4XUTfXLYIksSWDH-AbkMg04-W8xIFzTiV3Img/edit?resourcekey=0-hNhpziKs3L2sdVQ1atWx6w" target="_blank" rel="noopener">open his portfolio</a> (requires access).</li></ol></div></details>
    <details class="acc"><summary>Rescue the videos and images from an existing deck</summary><div class="acc-body prose small"><ol><li>In Google Slides: File → Download → Microsoft PowerPoint (.pptx).</li><li>A .pptx is a zip. Rename the file to end in .zip (or open it with any unzip tool) and look in <code>ppt/media/</code>. Every embedded image and Drive-hosted video is there as a file.</li><li>Videos inserted from YouTube are links, not files; they are not in the zip. Videos inserted from Drive usually are, and the originals are still in your Drive: in Slides, click the video → Format options shows the source.</li><li>Keep the originals in one Drive folder named for the portfolio so the next version starts with assets, not screenshots.</li></ol></div></details></div></div></div>`;

function cleanClause(t){let s=String(t).replace(FILLERS,' ').replace(/\s+/g,' ').trim();s=s.replace(/^(and|but|so|then|also|because|well|okay|ok|anyway|plus|probably|usually)[,\s]+/i,'');

  const clauses=texts.join('\n').split(/(?<=[.!?])\s+|\n+|;\s+|\s+and then\s+|\s+and also\s+/i).map(x=>x.trim()).filter(x=>x.length>12);const seen=new Set();const out=[];

function netState(){S.network=S.network||{people:[]};S.network.people=S.network.people||[];return S.network}
function netUI(){const u=uiState();u.net=u.net||{tab:'people',q:'',min:0,tag:'',person:null,tpl:'cold'};return u.net}
function personInit(p){return (p.name||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function starsHTML(n,interactive,id){return `<span class="stars ${interactive?'edit':''}" ${interactive?`role="radiogroup" aria-label="Rating"`:`aria-label="${n||0} of 5"`}>${[1,2,3,4,5].map(i=>interactive?`<button type="button" role="radio" aria-checked="${n===i}" data-star="${i}" title="${i} · ${RATING_LABELS[i]}" class="${i<=n?'on':''}">★</button>`:`<i class="${i<=n?'on':''}">★</i>`).join('')}</span>`}
function dueState(p){if(!p.nextDate)return null;const d=new Date(p.nextDate+'T00:00:00');const today=new Date();today.setHours(0,0,0,0);const diff=Math.round((d-today)/86400000);if(diff<0)return {k:'over',t:`${-diff} d overdue`};if(diff===0)return {k:'today',t:'today'};if(diff<=7)return {k:'week',t:`in ${diff} d`};return {k:'later',t:new Date(p.nextDate+'T00:00:00').toLocaleDateString([],{month:'short',day:'numeric'})}}
function netTags(){const t=new Set();netState().people.forEach(p=>(p.tags||[]).forEach(x=>t.add(x)));return [...t].sort()}
function todayISO(){return new Date().toISOString().slice(0,10)}
function fillTemplate(body,p,r){const b=r.basic;const first=p?(p.name||'').split(' ')[0]:'[First]';const edu=r.sections.find(s=>s.type==='education');const school=edu&&edu.items[0]&&edu.items[0].org||'';const emp=r.sections.find(s=>s.type==='employment');const cur=emp&&emp.items.find(it=>it.current);const company=cur&&cur.org||'';const role=cur&&cur.role||b.title||'';
  return body.replace(/\[First\]/g,first).replace(/\[Me\]/g,b.name||'[Me]').replace(/\[Company\]/g,p&&p.company?p.company:'[Company]').replace(/\[School\/Company\]/g,company||school||'[School/Company]').replace(/\[School\]/g,school||'[School]').replace(/\[Phone\]/g,b.phone||'[Phone]').replace(/\[LinkedIn\]/g,b.linkedin?('linkedin.com/in/'+String(b.linkedin).replace(/^https?:\/\/(www\.)?linkedin\.com\/in\//i,'').replace(/\/$/,'')):'[LinkedIn]').replace(/\[their earlier role\]/g,p&&p.role?'your earlier work':'[their earlier role]').replace(/\[year\/role\]/g,role||'[year/role]')}

function openPersonDialog(id){const N=netState();const p=id?N.people.find(x=>x.id===id):{id:null,name:'',company:'',role:'',how:'',met:'',rating:0,email:'',linkedin:'',phone:'',tags:[],last:'',next:'',nextDate:'',notes:''};if(!p)return;const tags=netTags();

    ${tags.length?`<div class="row full">${tags.map(t=>`<button type="button" class="chip sm" data-ptag="${esc(t)}">+ ${esc(t)}</button>`).join('')}</div>`:''}

  let rating=p.rating||0;$$('[data-star]').forEach(b=>b.onclick=()=>{rating=+b.dataset.star;$$('[data-star]').forEach(x=>{x.classList.toggle('on',+x.dataset.star<=rating);x.setAttribute('aria-checked',+x.dataset.star===rating)});$('#pp-rlabel').textContent=RATING_LABELS[rating]});

}
function logTouch(p){openDialog(`<h2>Log a touch with ${esc(p.name)}</h2><p class="muted">Sets today as the last contact and keeps a dated note.</p><label class="field" style="margin-top:12px"><span class="lbl">What happened</span><textarea id="lt-note" rows="3" placeholder="20-minute call. She suggested I talk to the rotational program lead."></textarea></label><div class="grid2" style="margin-top:10px"><label class="field"><span class="lbl">Next step</span><input id="lt-next" value="${esc(p.next||'')}" placeholder="Send thank-you"></label><label class="field"><span class="lbl">Follow-up date</span><input id="lt-date" type="date" value="${esc(p.nextDate||'')}"></label></div><div class="dlg-actions"><button type="button" class="btn btn-outline" id="lt-no">Cancel</button><button type="button" class="btn btn-filled" id="lt-ok">Save</button></div>`);

function xlsxBook(sheets){const colName=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
  const sheetXml=sh=>{const rows=sh.rows.map((r,ri)=>`<row r="${ri+1}">${r.map((c,ci)=>{const ref=colName(ci)+(ri+1);if(c==null||c==='')return '';if(typeof c==='number')return `<c r="${ref}"${ri===0?' s="1"':''}><v>${c}</v></c>`;return `<c r="${ref}" t="inlineStr" s="${ri===0?1:2}"><is><t xml:space="preserve">${xmlEsc(String(c))}</t></is></c>`}).join('')}</row>`).join('');
    const cols=sh.widths?`<cols>${sh.widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>`:'';const last=colName(Math.max(1,sh.rows[0].length)-1);const n=Math.max(sh.rows.length,2);

    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"${sh===sheets[0]?' tabSelected="1"':''}><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>${cols}<sheetData>${rows}</sheetData><autoFilter ref="A1:${last}${n}"/>${dv}</worksheet>`};
  const files=[
    {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`},

function builderSecnavHTML(r){return `<nav class="secnav" aria-label="Sections"><h4>Jump to</h4><a href="#basic" data-jump="basic">Basic info</a>${r.sections.map(s=>`<div class="sj"><button type="button" class="drag" data-drag="sec" title="Drag to reorder sections" aria-label="Move section ${esc(s.title)} (drag, or arrow keys)">${ICONS.grip}</button><a href="#s-${s.id}" data-jump="s-${s.id}" class="${s.hidden?'hiddenSec':''}">${esc(s.title)}<span class="n">${s.items.filter(it=>!it.hidden).length||''}</span></a></div>`).join('')}<div class="secopts"><button type="button" class="btn btn-text sm" style="justify-content:flex-start" data-act="addsec">${ICONS.plus} Add a section</button><button type="button" class="btn btn-text sm" style="justify-content:flex-start" data-act="import">${ICONS.upload} Import a résumé</button></div></nav>`}

function bankGroups(r,q){q=(q||'').toLowerCase().trim();const master=masterResume();const txt=it=>[it.org,it.role,it.loc,it.desc,it.bullets,(it.bank||[]).join(' ')].filter(Boolean).join(' ').toLowerCase();const hit=t=>!q||t.includes(q);
  const hidden=[];r.sections.forEach(s=>{const T=TYPES[s.type]||TYPES.custom;s.items.forEach(it=>{if(it.hidden&&hit(txt(it)))hidden.push({s,T,it})})});
  const fromMaster=[];if(master&&master!==r){const ids=new Set(r.sections.flatMap(s=>s.items.map(it=>it.id)));const sigs=new Set(r.sections.flatMap(s=>s.items.map(it=>strHash((it.org||'')+'|'+(it.role||'')))));master.sections.forEach(ms=>{const T=TYPES[ms.type]||TYPES.custom;if(T.single)return;ms.items.forEach(it=>{if(ids.has(it.id)||sigs.has(strHash((it.org||'')+'|'+(it.role||''))))return;if(!itemHasContent(T,it))return;if(hit(txt(it)))fromMaster.push({s:ms,T,it})})})}
  const ideas=[];FINDER.forEach(cat=>cat.items.forEach(f=>{if(hit((f.label+' '+f.org+' '+(f.role||'')+' '+(f.bullets||[]).join(' ')).toLowerCase()))ideas.push(Object.assign({cat:cat.cat},f))}));
  return {hidden,fromMaster,ideas,master}}
function bankRowHTML(x,kind){const it=x.it;const bl=bulletList(it);return `<div class="bankrow" data-bank="${kind}:${it.id}"><div class="bk-t"><b>${esc(entryTitle(x.T,it))}</b><span class="small muted">${esc(x.s.title)}${bl.length?` · ${bl.length} bullet${bl.length===1?'':'s'}`:''}${x.T.skills&&it.desc?' · '+esc(it.desc.slice(0,60)):''}</span>${bl.length?`<div class="small muted bk-b">${esc(bl[0].slice(0,110))}${bl[0].length>110?'…':''}</div>`:''}</div><button type="button" class="btn btn-tonal xs" data-bankadd="${kind}:${it.id}">${kind==='hidden'?'Show':'Add'}</button></div>`}
function panelHTML(r,check){const tab=BUILD.panel;const high=check.issues.filter(i=>i.sev==='high').length,med=check.issues.filter(i=>i.sev==='med').length;const g=bankGroups(r,BUILD.bankQ);const bankN=g.hidden.length+g.fromMaster.length;
  const tabs=`<div class="ptabs" role="tablist">${[['page','Page'],['check',`Check${resumeIsBlank(r)?'':` · ${check.score}`}`],['bank',`Bank${bankN?` · ${bankN}`:''}`]].map(([k,l])=>`<button type="button" role="tab" aria-selected="${tab===k}" data-ptab="${k}">${l}</button>`).join('')}</div>`;
  let body='';
  if(tab==='page')body=`${tailorStripHTML(r)}<div class="livehead"><span id="pagecount"></span><a href="#builder-design" data-go="builder-design">Design →</a></div><div class="stage compact"><div class="paperwrap" id="livewrap"><div class="paper" id="livepaper"></div></div></div>`;
  else if(tab==='check'){const circ=2*Math.PI*48;const by=sev=>check.issues.filter(i=>i.sev===sev);
    body=resumeIsBlank(r)?`<div class="empty">The check starts once there is something on the page.</div>`:`<div class="pcheck"><div class="row" style="gap:14px;align-items:center"><div class="ring sm"><svg viewBox="0 0 110 110"><circle class="track" cx="55" cy="55" r="48"/><circle class="val" cx="55" cy="55" r="48" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${(circ*(1-check.score/100)).toFixed(1)}"/></svg><div class="num">${check.score}</div></div><div><b>${esc(check.grade)}</b><div class="row" style="margin-top:4px"><span class="badge bad">${by('high').length} high</span><span class="badge warn">${by('med').length} medium</span><span class="badge info">${by('low').length} low</span></div></div></div>
      ${(()=>{const j=jobFor(r);if(!j)return '';const mt=matchJob(j,r);return `<div class="pjob"><span class="badge ${mt.score>=70?'ok':mt.score>=45?'warn':'bad'}">${mt.score}% match</span> <span class="small">${esc(j.company||j.title||'job')}${mt.missing.length?` · ${mt.missing.length} missing`:''}</span><a class="btn btn-text xs" href="#tailor-job" data-go="tailor-job" data-job="${j.id}">Analysis</a></div>`})()}
      <div class="pissues">${check.issues.filter(i=>i.sev!=='good').map((i,idx)=>`<div class="issue ${i.sev}"><div class="stripe"></div><div><h4>${esc(i.title)}</h4>${i.detail?`<p>${esc(i.detail)}</p>`:''}${i.ex?`<div class="ex">${i.ex}</div>`:''}</div><div>${i.where&&(i.where.itemId||i.where.secId||i.where.field)?`<button type="button" class="btn btn-text xs" data-fixw='${esc(JSON.stringify(i.where))}'>Fix</button>`:(i.where&&i.where.design?`<button type="button" class="btn btn-text xs" data-fitpage="1">Fit</button>`:'')}</div></div>`).join('')||'<div class="empty">Nothing to fix. Keep the receipts for every number.</div>'}</div>
      <p class="small muted" style="margin-top:10px">Start at 100; high-impact issues cost 12, medium 6, low 2. One page, verbs first, numbers everywhere, tense that matches the dates.</p></div>`}
  else body=`<div class="pbank"><label class="field libsearch"><span class="vh">Search the bank</span>${ICONS.search}<input id="bank-q" type="search" value="${esc(BUILD.bankQ)}" placeholder="Search experiences, skills, bullets…"></label>
      ${g.hidden.length?`<h4>In the bank for this résumé <span class="muted">${g.hidden.length}</span></h4><p class="small muted">Parked here, not on the page. Show one to bring it back.</p><div class="banklist">${g.hidden.map(x=>bankRowHTML(x,'hidden')).join('')}</div>`:''}
      ${g.fromMaster.length?`<h4>From your master <span class="muted">${g.fromMaster.length}</span></h4><p class="small muted">On “${esc(g.master.name)}” but not here yet.</p><div class="banklist">${g.fromMaster.map(x=>bankRowHTML(x,'master')).join('')}</div>`:''}
      ${!g.hidden.length&&!g.fromMaster.length&&!BUILD.bankQ?`<div class="small muted" style="margin:6px 0 10px">${g.master&&g.master!==r?'Everything on your master is already here. Untick an entry on the left to park it in the bank.':'Untick any entry or bullet on the left and it waits here instead of being deleted.'}</div>`:''}
      <h4 style="margin-top:14px">Things people forget <span class="muted">${g.ideas.length}</span></h4><p class="small muted">Tick what you have done, even once. Each becomes a draft entry with [brackets] where your numbers go.</p><div class="ideas">${g.ideas.map(f=>`<label class="check small"><input type="checkbox" data-idea="${f.id}"><span>${esc(f.label)}<span class="muted"> → ${esc((TYPES[f.sec]||TYPES.custom).title)}</span></span></label>`).join('')}</div><div class="row" style="margin-top:8px"><button type="button" class="btn btn-filled sm" id="ideas-add" disabled>Add drafts</button></div></div>`;
  return `<div class="panel">${tabs}<div class="pbody">${body}</div></div>`}
function renderPanel(m,r){const aside=$('.live',m);if(!aside)return;const check=checkResume(r);aside.innerHTML=panelHTML(r,check);bindPanel(m,r);if(BUILD.panel==='page'){updateLive(r);observeFit($('#livewrap',m))}}
function bindPanel(m,r){const aside=$('.live',m)||m;
  $$('[data-ptab]',aside).forEach(b=>b.onclick=()=>{BUILD.panel=b.dataset.ptab;renderPanel(m,r)});
  const hl=$('#hl-toggle',aside);if(hl)hl.onchange=()=>{S.prefs.hl=hl.checked;save(['meta']);updateLive(r)};$$('[data-job]',aside).forEach(ja=>ja.addEventListener('click',()=>{S.activeJobId=ja.dataset.job}));
  $$('[data-fixw]',aside).forEach(b=>b.onclick=()=>focusField(m,r,JSON.parse(b.dataset.fixw)));
  const fp=$('[data-fitpage]',aside);if(fp)fp.onclick=()=>{const before=deepClone(r.settings);const res=fitToOnePage(r);save();renderPanel(m,r);if(res.changed.length)showUndo(res.fits?`Fits one page now (${res.changed.join(', ')})`:`Tightened ${res.changed.join(', ')}; still ${Math.round((res.pages-1)*100)}% over.`,()=>{r.settings=before;save();renderPanel(m,r)});else toast('Spacing is already at the limits. Park the weakest bullets in the bank.')};
  const q=$('#bank-q',aside);if(q)q.oninput=debounce(()=>{BUILD.bankQ=q.value;renderPanel(m,r);const q2=$('#bank-q');if(q2){q2.focus();q2.setSelectionRange(q2.value.length,q2.value.length)}},200);
  $$('[data-bankadd]',aside).forEach(b=>b.onclick=()=>{const [kind,id]=b.dataset.bankadd.split(':');bankAdd(m,r,kind,id)});
  const sel=new Set();$$('[data-idea]',aside).forEach(cb=>cb.onchange=()=>{cb.checked?sel.add(cb.dataset.idea):sel.delete(cb.dataset.idea);const btn=$('#ideas-add',aside);btn.disabled=!sel.size;btn.textContent=sel.size?`Add ${sel.size} draft${sel.size===1?'':'s'}`:'Add drafts'});
  const ia=$('#ideas-add',aside);if(ia)ia.onclick=()=>{const all=FINDER.flatMap(c=>c.items);let n=0,last=null;for(const id of sel){const f=all.find(x=>x.id===id);let s=r.sections.find(x=>x.type===f.sec);if(!s){s=withIds({sections:[mkSec(f.sec)]}).sections[0];r.sections.push(s)}if(f.sec==='skills'){const gpl=s.items.find(x=>x.org&&x.org.toLowerCase()===f.org.toLowerCase());if(gpl){gpl.desc=(gpl.desc?gpl.desc+', ':'')+f.desc;last=gpl}else{last=mkItem({id:uid(),org:f.org,desc:f.desc});s.items.push(last)}}else{last=mkItem({id:uid(),org:f.org,role:f.role||'',bullets:(f.bullets||[]).join('\n'),current:false});s.items.push(last)}BUILD.open.add(last.id);n++}save();rerenderContent(m,r);toast(`${n} draft${n===1?'':'s'} added. Replace the [brackets].`);if(last)setTimeout(()=>{const el=$(`[data-item="${last.id}"]`);el&&el.scrollIntoView({behavior:'smooth',block:'center'})},60)}}
function bankAdd(m,r,kind,id){if(kind==='hidden'){for(const s of r.sections){const it=s.items.find(x=>x.id===id);if(it){it.hidden=false;BUILD.open.add(it.id);save();rerenderContent(m,r);toast('Back on the page');setTimeout(()=>{const el=$(`[data-item="${it.id}"]`);el&&el.scrollIntoView({behavior:'smooth',block:'center'})},60);return}}}
  else{const master=masterResume();for(const ms of master.sections){const it=ms.items.find(x=>x.id===id);if(it){let s=r.sections.find(x=>x.type===ms.type&&(ms.type!=='custom'||x.title===ms.title));if(!s){s=withIds({sections:[mkSec(ms.type,ms.title)]}).sections[0];r.sections.push(s)}const c=deepClone(it);c.hidden=false;s.items.push(c);BUILD.open.add(c.id);save();rerenderContent(m,r);toast(`Added from your master`);setTimeout(()=>{const el=$(`[data-item="${c.id}"]`);el&&el.scrollIntoView({behavior:'smooth',block:'center'})},60);return}}}}
function focusField(m,r,f){if(!f)return;if(f.itemId)BUILD.open.add(f.itemId);if(f.field)BUILD.open.add('basic');rerenderContent(m,r);setTimeout(()=>{let el=f.itemId?$(`[data-item="${f.itemId}"]`):f.secId?$(`#s-${f.secId}`):f.field?$(`[data-scope="basic"] [data-k="${f.field}"]`):null;if(f.field&&el)el=el.closest('.field')||el;if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.boxShadow='0 0 0 3px var(--warn)';setTimeout(()=>el.style.boxShadow='',2200);const inp=el.querySelector?el.querySelector('input:not([type=checkbox]),textarea'):null;(inp||el).focus&&(inp||el).focus({preventScroll:true})}},80)}
function openBuilderSheet(m,r,tab){BUILD.panel=tab;const d=$('#sheet');const check=checkResume(r);$('#sheetbody').innerHTML=`<button type="button" class="btn-icon dlg-x" id="sheet-x" aria-label="Close">${ICONS.x}</button>${panelHTML(r,check)}`;if(!d.open){try{d.showModal()}catch(e){d.setAttribute('open','')}}

  const ia=$('#ideas-add',body);if(ia)ia.onclick=()=>{const all=FINDER.flatMap(c=>c.items);for(const id of sel){const f=all.find(x=>x.id===id);let s=r.sections.find(x=>x.type===f.sec);if(!s){s=withIds({sections:[mkSec(f.sec)]}).sections[0];r.sections.push(s)}const it=f.sec==='skills'?mkItem({id:uid(),org:f.org,desc:f.desc}):mkItem({id:uid(),org:f.org,role:f.role||'',bullets:(f.bullets||[]).join('\n')});s.items.push(it);BUILD.open.add(it.id)}save();closeSheet();rerenderContent(m,r);toast('Drafts added. Replace the [brackets].')};
  if(BUILD.panel==='page'){const p=$('#livepaper',body);if(p){renderResumeInto(p,r);observeFit($('#livewrap',body));const pages=measurePages(r);const pc=$('#pagecount',body);if(pc)pc.innerHTML=pages>1.02?`<span class="badge bad">${Math.round((pages-1)*100)}% over one page</span>`:`<span class="badge ok">Fits one page (${Math.round(pages*100)}% used)</span>`}}
  $('#sheet-x').onclick=closeSheet}
